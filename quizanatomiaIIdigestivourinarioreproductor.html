<style>

@media (prefers-color-scheme:dark){:root{--bg:#161b1d;--card:#20282b;--ink:#eef1f0;--mute:#9fb0b4;--line:#34413f;--accent:#6cc4bd;--ok:#7fd3a0;--okbg:#1d3a2b;--bad:#f09a90;--badbg:#3f2522}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,serif;line-height:1.55;padding:24px 16px}
main{max-width:680px;margin:0 auto}h1{font-size:1.55rem;margin:0 0 4px}.sub{color:var(--mute);margin:0 0 20px;font:.9rem system-ui,sans-serif}

.bar{height:5px;background:var(--line);border-radius:3px;margin-bottom:16px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.q{font-size:1.1rem;margin:0 0 16px}
.opt{display:block;width:100%;text-align:left;font:inherit;background:transparent;color:inherit;border:1px solid var(--line);border-radius:8px;padding:11px 14px;margin-bottom:8px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}.opt:disabled{cursor:default}

.score{font-size:2.4rem;margin:4px 0}.rev{font-size:.93rem;border-top:1px solid var(--line);padding:10px 0}.rev b{color:var(--ok)}

<h1>Anatomía II: digestivo, urinario, reproductor y sentidos</h1>
<p class="sub">Preguntas de parciales y ordinarios de Anatomía II, con el texto original</p>
<div class="card" id="app"></div></main>
<script>
const DATA = [{"a": "dig", "q": "En esta parte del tronco encefálico se encuentra el centro cardiovascular, el reflejo del vómito, deglución, estornudos, tos e hipo:", "o": ["cerebelo", "mesencéfalo", "protuberancia", "bulbo raquídeo"], "c": 3, "fb": "El bulbo raquídeo es el centro de los reflejos vitales: aquí están el centro cardiovascular y respiratorio y los centros de los reflejos de vómito y deglución (parte del control del tubo digestivo alto), además de estornudo, tos e hipo. Cerebelo: no es parte del tronco encefálico; suaviza y coordina la contracción de los músculos esqueléticos. Mesencéfalo: contiene los núcleos de los nervios III y IV y los reflejos visuales y auditivos. Protuberancia: contiene los núcleos de los nervios V, VI, VII y VIII y participa en la regulación del ritmo respiratorio."}, {"a": "dig", "q": "Este nervio controla la presión arterial, excreción de órganos gastrointestinales y constricción de vías respiratorias; transmite el gusto desde la epiglotis.", "o": ["X", "XI", "XII", "IX"], "c": 0, "fb": "El nervio vago (X) lleva fibras parasimpáticas a las vísceras del tórax y del abdomen: estimula la motilidad y las secreciones del tubo digestivo (hasta aproximadamente los dos tercios proximales del colon transverso). También regula la frecuencia cardiaca y la presión arterial, constriñe las vías respiratorias y transmite el gusto de la epiglotis. XI (accesorio): inerva los músculos trapecio y esternocleidomastoideo. XII (hipogloso): es el nervio motor de los músculos de la lengua. IX (glosofaríngeo): lleva el gusto del tercio posterior de la lengua, inerva la glándula parótida y el seno carotídeo; no controla las vísceras abdominales."}, {"a": "dig", "q": "¿Qué glándula salival secreta saliva a través de un conducto que perfora el músculo buccinador y desemboca en el segundo molar superior?", "o": ["Parótida", "Submandibulares", "Sublinguales"], "c": 0, "fb": "La parótida: su conducto (de Stensen) perfora el buccinador y desemboca frente al segundo molar superior."}, {"a": "dig", "q": "Esta glándula salival drena su contenido a través del conducto de Wharton, que desemboca en la papila sublingual:", "o": ["Parótida", "Submandibular", "Sublingual", "Glándula labial menor"], "c": 1, "fb": "La submandibular drena por el conducto de Wharton a un lado del frenillo lingual."}, {"a": "dig", "q": "Forma parte del diente, se considera una parte esencial, porque ancla el diente a la pared alvéolo, lo fija con la región más subyacente del alveolo y actúa como amortiguador de golpes durante la masticación.", "o": ["Cemento", "Encia", "Ligamento periodontal", "Dentina"], "c": 2, "fb": "El ligamento periodontal fija el diente a la pared del alvéolo y actúa como amortiguador."}, {"a": "dig", "q": "¿Qué afirmación es cierta acerca de la boca o cavidad bucal?", "o": ["La úvula durante la deglución desciende, lo que permite el paso de los alimentos a la cavidad nasal.", "Los huesos del paladar están conformados por el hueso lagrimal y el etmoides.", "El paladar es una pared o septo que separa la cavidad bucal de la nasal y forma el techo de la boca.", "El paladar duro es la porción posterior de la boca."], "c": 2, "fb": "El paladar es el septo entre boca y nariz. Al deglutir la úvula asciende (no desciende) para cerrar la nasofaringe, y el paladar duro es la porción anterior."}, {"a": "dig", "q": "Los músculos constrictores de la faringe son:", "o": ["Estilofaríngeo, palatofaríngeo y salpingofaríngeo", "Constrictor superior, medio e inferior", "Tensor del velo del paladar y elevador del velo", "Genihioideo, milohioideo y digástrico"], "c": 1, "fb": "Los constrictores superior, medio e inferior impulsan el bolo alimenticio hacia el esófago durante la deglución."}, {"a": "dig", "q": "¿Cuál de las siguientes es una función propia del sistema nervioso parasimpático?", "o": ["Midriasis pupilar", "Aumento de la frecuencia cardíaca", "Aumento del peristaltismo intestinal", "Vasoconstricción periférica"], "c": 2, "fb": "El parasimpático (vago y nervios sacros) estimula la motilidad y las secreciones digestivas. Las demás opciones son efectos simpáticos."}, {"a": "dig", "q": "¿Cuál de las siguientes afirmaciones sobre los plexos entéricos es correcta?", "o": ["El plexo mientérico es conocido como plexo de meissner y se encuentra en la capa submucosa", "El plexo submucoso es conocido como el plexo meissner y se encuentra en la capa submucosa", "El plexo submucoso se encuentra en la capa muscular", "El plexo de auerbach se encuentra en la capa submucosa"], "c": 1, "fb": "El plexo submucoso (de Meissner) está en la submucosa. El mientérico (de Auerbach) está entre las capas musculares."}, {"a": "dig", "q": "Cuando se presenta una alteración en la motilidad intestinal, ¿en cuál estructura del sistema nervioso entérico es más probable que se localice la lesión?", "o": ["Nervio vago", "Plexo de Auerbach", "Plexo de Meissner"], "c": 1, "fb": "El plexo mientérico (de Auerbach) controla la motilidad de la pared muscular del tubo digestivo."}, {"a": "dig", "q": "El esófago atraviesa el diafragma a través del hiato esofágico, que se localiza a nivel de la vértebra:", "o": ["T8", "T10", "T12", "L1"], "c": 1, "fb": "El hiato esofágico está en T10. La vena cava inferior pasa en T8 y la aorta en T12."}, {"a": "dig", "q": "¿Qué nombre recibe la zona de unión gastroesofágica que conecta el esófago con el fondo del estómago?", "o": ["antro pilórico", "cardias", "válvula esofágica superior", "esfínter gastrointestinal"], "c": 1, "fb": "El cardias es la región donde el esófago desemboca en el estómago."}, {"a": "dig", "q": "Una mujer de 48 años con cirrosis hepática secundaria a hepatitis C presenta hematemesis. La endoscopia revela várices en la unión gastroesofágica. La sangre drena en este sitio a través de la anastomosis entre la vena gástrica izquierda y la vena:", "o": ["Ácigos", "Cava inferior directamente", "Esplénica", "Mesentérica superior"], "c": 0, "fb": "Con hipertensión portal, la vena gástrica izquierda (sistema porta) deriva sangre a las venas esofágicas y a la ácigos (sistema cava), formando várices."}, {"a": "dig", "q": "Un paciente presenta várices esofágicos, ¿cuál de las siguientes estructuras será la principal causante?:", "o": ["mesentérica superior", "mesentérica inferior", "gástrica izquierda", "gástrica derecha"], "c": 2, "fb": "La vena gástrica izquierda se anastomosa con las venas esofágicas; por eso la hipertensión portal produce várices esofágicas."}, {"a": "dig", "q": "¿Cuál es la curvatura del estómago irrigada principalmente por las arterias gástricas izquierda y derecha?", "o": ["Curvatura mayor", "Curvatura menor", "Fondo gástrico", "Píloro"], "c": 1, "fb": "La gástrica izquierda y la derecha se anastomosan a lo largo de la curvatura menor. La mayor la irrigan las gastroepiploicas."}, {"a": "dig", "q": "Una paciente presenta dificultad severa para el vaciamiento gástrico debido a hipertrofia muscular localizada en la región distal del estómago. El problema anatómico afecta directamente el paso del quimo hacia el duodeno. ¿Qué estructura está afectada?", "o": ["Cardias", "Fondo gástrico", "Esfínter pilórico", "Curvatura mayor"], "c": 2, "fb": "El esfínter pilórico regula el vaciamiento gástrico hacia el duodeno."}, {"a": "dig", "q": "Un hombre de 50 años presenta hematemesis masiva por una úlcera péptica situada en la cara posterior del bulbo duodenal. ¿Qué arteria es la que con mayor probabilidad fue erosionada por la úlcera?", "o": ["Gástrica izquierda", "Gastroduodenal", "Esplénica", "Hepática propia"], "c": 1, "fb": "La gastroduodenal pasa por detrás de la primera porción del duodeno y se erosiona en las úlceras posteriores."}, {"a": "dig", "q": "El tronco celíaco emerge de la aorta abdominal aproximadamente a nivel de la vértebra:", "o": ["T10", "T12", "L1", "L3"], "c": 1, "fb": "El tronco celíaco nace en T12; la mesentérica superior en L1."}, {"a": "dig", "q": "La arteria mesentérica inferior se origina de la aorta abdominal a nivel de la vértebra:", "o": ["L1", "L2", "L3", "L5"], "c": 2, "fb": "La mesentérica inferior nace en L3 e irriga colon descendente, sigmoide y recto superior."}, {"a": "dig", "q": "Las tres ramas principales del tronco celíaco son:", "o": ["Gástrica izquierda, esplénica y hepática común", "Mesentérica superior, esplénica y gástrica derecha", "Hepática propia, mesentérica inferior y esplénica", "Gastroduodenal, gástrica derecha y esplénica"], "c": 0, "fb": "El tronco celíaco da la gástrica izquierda, la esplénica y la hepática común."}, {"a": "dig", "q": "Paciente acude a consulta debido a un dolor intenso en el epigastrio, el órgano afectado se encuentra a nivel de L1 y L2, es retroperitoneal y se encuentra detrás del estómago. ¿Qué estructura es?", "o": ["estómago", "lóbulo hepático izquierdo", "lóbulo hepático derecho", "páncreas"], "c": 3, "fb": "El páncreas es retroperitoneal, queda detrás del estómago a nivel de L1-L2."}, {"a": "dig", "q": "¿Cuál de las siguientes estructuras separa al duodeno del yeyuno?", "o": ["Píloro", "Ángulo de Treitz (ligamento suspensorio del duodeno)", "Válvula ileocecal", "Esfínter de Oddi"], "c": 1, "fb": "El ligamento suspensorio del duodeno (de Treitz) marca la unión duodenoyeyunal."}, {"a": "dig", "q": "El conducto pancreático principal (de Wirsung) desemboca normalmente en:", "o": ["El estómago, a nivel del píloro", "La segunda porción del duodeno (ampolla de Vater)", "El yeyuno proximal", "El conducto cístico"], "c": 1, "fb": "Se une al colédoco y desemboca en la segunda porción (descendente) del duodeno, en la papila duodenal mayor."}, {"a": "dig", "q": "¿Qué conducto pancreático se une con el conducto colédoco para formar la ampolla de Vater?", "o": ["Conducto de Santorini", "Conducto hepático común", "Conducto de Wirsung"], "c": 2, "fb": "El de Wirsung (principal) se une al colédoco y forma la ampolla hepatopancreática."}, {"a": "dig", "q": "Parte del intestino delgado donde se encuentra mayor tejido linfoide conocido como las placas de Peyer.", "o": ["Duodeno", "Ilion", "Yeyuno"], "c": 1, "fb": "Las placas de Peyer predominan en el íleon."}, {"a": "dig", "q": "¿Pliegue peritoneal con forma de abanico que une el yeyuno e íleon con la pared abdominal posterior?", "o": ["Mesocolon", "Ligamento redondo", "Mesenterio"], "c": 2, "fb": "El mesenterio sostiene yeyuno e íleon y conduce sus vasos."}, {"a": "dig", "q": "Durante la fase intestinal de la digestión, la presencia de aminoácidos y ácidos grasos en el quimo duodenal estimula la liberación de Colecistoquinina (CCK). ¿Cuál de los siguientes es un efecto fisiológico específico de esta hormona?", "o": ["Estimulación de la secreción de un jugo pancreático rico en bicarbonato para neutralizar el ácido.", "Contracción del músculo liso de la vesícula biliar y relajación del esfínter de la ampolla hepatopancreática (de Vater).", "Aumento de la secreción de ácido clorhídrico por parte de las células parietales mediante la vía de la gastrina.", "Estimulación del complejo mioeléctrico migrante para iniciar la motilidad en ayunas."], "c": 1, "fb": "La CCK contrae la vesícula y relaja el esfínter de Oddi. El jugo rico en bicarbonato lo estimula la secretina."}, {"a": "dig", "q": "En el intestino delgado, las células absortivas presentan microvellosidades que forman el \"borde en cepillo\". ¿Cuál de las siguientes enzimas se encuentra anclada específicamente en la membrana plasmática de estas microvellosidades y no es secretada al lumen?", "o": ["Amilasa pancreática.", "Elastasa.", "α-dextrinasa.", "Lipasa lingual."], "c": 2, "fb": "La α-dextrinasa es enzima del borde en cepillo. Las demás se secretan al lumen."}, {"a": "dig", "q": "Un hombre de 67 años con fibrilación auricular presenta dolor abdominal súbito desproporcionado a los hallazgos físicos. La angiotomografía muestra trombo en el origen de la arteria mesentérica superior. ¿Qué porción del intestino se afectará primero?", "o": ["Colon transverso", "Yeyuno e íleon", "Colon descendente", "Duodeno"], "c": 1, "fb": "La AMS irriga yeyuno e íleon (además de colon ascendente y 2/3 proximales del transverso); el colon descendente depende de la mesentérica inferior."}, {"a": "dig", "q": "La arteria mesentérica superior irriga las siguientes estructuras, EXCEPTO:", "o": ["Yeyuno e íleon", "Colon ascendente", "Dos tercios derechos del colon transverso", "Colon descendente y sigmoide"], "c": 3, "fb": "El colon descendente y el sigmoide los irriga la mesentérica inferior."}, {"a": "dig", "q": "Un paciente presenta una oclusión en la arteria mesentérica superior. ¿Qué arteria se ve directamente afectada?", "o": ["pancreatoduodenal superior", "pancreatoduodenal inferior", "pancreática", "gastroduodenal"], "c": 1, "fb": "La pancreatoduodenal inferior nace de la AMS; la superior nace de la gastroduodenal (tronco celíaco)."}, {"a": "dig", "q": "Una mujer de 22 años presenta dolor periumbilical migratorio que se localiza, 6 horas después, en la fosa ilíaca derecha. Refiere fiebre, náusea y signo de McBurney positivo. ¿Cuál es la estructura más probablemente inflamada?", "o": ["Apéndice cecal", "Divertículo de Meckel", "Trompa uterina derecha", "Vesícula biliar"], "c": 0, "fb": "Es el cuadro clásico de apendicitis."}, {"a": "dig", "q": "Señale la afirmación INCORRECTA respecto al colon:", "o": ["El colon ascendente y descendente son retroperitoneales", "El colon transverso y sigmoide poseen mesenterio", "Las tenias coli son tres bandas longitudinales de músculo liso", "El colon descendente está irrigado por la arteria mesentérica superior"], "c": 3, "fb": "El colon descendente lo irriga la mesentérica inferior."}, {"a": "dig", "q": "El drenaje venoso del recto superior se dirige hacia el sistema:", "o": ["Cava inferior (sistémico)", "Porta, vía vena mesentérica inferior", "Ilíaco interno", "Pudendo interno"], "c": 1, "fb": "El recto superior drena a la mesentérica inferior y de ahí a la porta; recto medio e inferior drenan al sistema cava."}, {"a": "dig", "q": "¿Cómo se le llama a la curvatura que hace el colon entre el colon ascendente y el colon transverso?", "o": ["Flexura cólica derecha", "Colon sigmoides", "Colón descendente", "Flexura cólica izquierda"], "c": 0, "fb": "La flexura cólica derecha (hepática) une el colon ascendente con el transverso."}, {"a": "dig", "q": "El intestino grueso carece de vellosidades y pliegues circulares, pero presenta características estructurales únicas. ¿Cómo se denominan las bandas longitudinales de músculo liso engrosado que, al contraerse, forman las bolsas llamadas haustras?", "o": ["Apéndices epiplóicos.", "Pliegues semilunares.", "Tenias colónicas.", "Válvulas anales."], "c": 2, "fb": "Las tenias colónicas, al contraerse, forman las haustras."}, {"a": "dig", "q": "¿Cuál de las siguientes estructuras es característica del intestino grueso y lo diferencia del intestino delgado?", "o": ["Microvellosidades", "Pliegues semilunares", "Pliegues circulares", "Vellosidades intestinales"], "c": 1, "fb": "Los pliegues semilunares son del colon. El intestino delgado tiene pliegues circulares, vellosidades y microvellosidades."}, {"a": "dig", "q": "El hígado se divide funcionalmente en cuántos segmentos según la clasificación de Couinaud:", "o": ["4 segmentos", "6 segmentos", "8 segmentos", "10 segmentos"], "c": 2, "fb": "La clasificación de Couinaud define 8 segmentos hepáticos."}, {"a": "dig", "q": "Esta estructura parte del peritoneo, ayuda a mantener unido el hígado con la pared anterior del abdomen y el diafragma, proporcionando al hígado que se fije y se suspenda en su posición anatómica.", "o": ["omento menor.", "mesenterio.", "omento mayor.", "Ligamento falciforme."], "c": 3, "fb": "El ligamento falciforme fija y suspende el hígado, y separa los lóbulos derecho e izquierdo."}, {"a": "dig", "q": "Esta capa del peritoneo se origina como un pliegue anterior en la serosa del estómago y del duodeno, permitiendo que se conecte el estómago y el duodeno con el hígado. También cumple con la función de vía para que los vasos sanguíneos entren en el hígado.", "o": ["Omento menor", "Omento mayor", "Mesocolon", "Mesenterio"], "c": 0, "fb": "El omento menor (ligamento hepatogástrico y hepatoduodenal) une estómago y duodeno con el hígado."}, {"a": "dig", "q": "¿Cuál de estas afirmaciones son ciertas de las arterias que pasan en el omento menor?", "o": ["Vena porta, arteria hepática.", "Arteria pancreática y gástrica corta", "Venas renales y arteria esplénica.", "Arteria gastroduodenal y Gástrica derecha."], "c": 3, "fb": "Reactivo ambiguo. Por el omento menor van la hepática propia y la gástrica derecha (más la porta y el colédoco); de las opciones, la d es la única formada solo por arterias."}, {"a": "dig", "q": "¿Cuál de las siguientes estructuras conforma correctamente la triada portal del hígado?", "o": ["Conducto hepático común y arteria hepática", "Conducto biliar, conducto hepático común y vena hepática", "Conducto ciático, rama de la arteria hepática y vena hepática derecha", "Conducto biliar, rama de la arteria hepática y la rama de la vena hepática"], "c": 3, "fb": "La tríada portal: conducto biliar, rama de la arteria hepática y rama de la vena porta (la opción d dice «vena hepática», pero es la más cercana)."}, {"a": "dig", "q": "El hígado recibe sangre de dos fuentes, pero la mezcla de sangre oxigenada y desoxigenada ocurre en un punto específico antes de salir del órgano. ¿Cuál es la secuencia correcta del flujo sanguíneo a través del lobulillo hepático?", "o": ["Arteria hepática/Vena porta → Sinusoides → Vena central → Venas hepáticas.", "Vena central → Sinusoides → Tríada portal → Vena cava inferior.", "Vena porta → Conducto colédoco → Sinusoides → Vena central.", "Arteria hepática → Conductos biliares → Vena porta → Venas hepáticas."], "c": 0, "fb": "La sangre arterial y la portal se mezclan en los sinusoides, pasan a la vena central y salen por las venas hepáticas."}, {"a": "dig", "q": "La sangre que pasa por la vena porta hepática, después de atravesar los sinusoides hepáticos, regresa al corazón a través de:", "o": ["Las venas hepáticas y la vena cava inferior", "La vena ácigos y la vena cava superior", "La vena esplénica y la vena renal izquierda", "La vena mesentérica inferior"], "c": 0, "fb": "Los sinusoides drenan a las venas hepáticas, que desembocan en la cava inferior."}, {"a": "dig", "q": "Un paciente con cirrosis hepática avanzada presenta circulación venosa visible en la pared abdominal alrededor del ombligo (\"cabeza de Medusa\"). ¿Qué vena dilatada produce este signo?", "o": ["Vena paraumbilical", "Vena epigástrica inferior", "Vena cava inferior", "Vena esplénica"], "c": 0, "fb": "Con hipertensión portal, las venas paraumbilicales se dilatan y conectan con las venas de la pared abdominal."}, {"a": "dig", "q": "Paciente masculino de 42 años de edad acude por dolor en hipocondrio derecho que describe como profundo y constante. Refiere que el dolor se irradia hacia el hombro derecho. En la exploración se encuentra hepatomegalia. ¿Qué estructura presenta irritación?", "o": ["Irritación del plexo lumbar", "Irritación del nervio vago", "Irritación del nervio frénico derecho", "Irritación del plexo pélvico"], "c": 2, "fb": "Es dolor referido: el frénico (C3-C5) inerva el diafragma y el peritoneo hepático, y comparte segmentos con la piel del hombro."}, {"a": "dig", "q": "Una mujer de 50 años con sobrepeso presenta dolor cólico en el cuadrante superior derecho irradiado a la escápula derecha, 30 minutos después de comer alimentos grasos. El ultrasonido muestra cálculos en la vesícula. ¿Por dónde drena normalmente la bilis desde la vesícula hacia el duodeno?", "o": ["Conducto cístico → conducto colédoco → ampolla de Vater", "Conducto hepático común → conducto cístico → duodeno", "Conducto pancreático principal → ampolla de Vater", "Conducto cístico → conducto hepático derecho"], "c": 0, "fb": "La bilis sale por el cístico, pasa al colédoco y llega al duodeno por la ampolla de Vater."}, {"a": "dig", "q": "Un paciente de 45 años se presenta con dolor intenso en el hipocondrio derecho que se irradia al hombro derecho, náuseas y esteatorrea (presencia de grasa en heces). Los estudios indican una obstrucción total del conducto colédoco por un lito (piedra) biliar. Basándote en la anatomía del sistema biliar y pancreático, ¿cuál de las siguientes consecuencias es fisiológicamente correcta para este caso?", "o": ["El paciente presentará niveles elevados de urobilinógeno en la orina debido a la hiperbilirrubinemia.", "La digestión de las proteínas se detendrá por completo debido a que el jugo pancreático no podrá llegar al duodeno bajo ninguna circunstancia.", "Se verá afectada la formación de micelas, impidiendo la absorción adecuada de vitaminas liposolubles (A, D, E, K).", "La bilis acumulada fluirá retrógradamente hacia el conducto cístico, aumentando la producción de bilis por los hepatocitos."], "c": 2, "fb": "Sin bilis no se forman micelas y falla la absorción de grasas y vitaminas liposolubles. Las proteínas aún se digieren porque el páncreas puede secretar por su conducto."}, {"a": "dig", "q": "Cual no forma parte de la vesícula biliar", "o": ["fundus", "cuerpo", "cabeza", "cuello"], "c": 2, "fb": "La vesícula tiene fundus, cuerpo, infundíbulo y cuello; la cabeza pertenece al páncreas."}, {"a": "dig", "q": "Señale la oración correcta respecto al páncreas:", "o": ["Es un órgano completamente intraperitoneal", "Su cabeza está rodeada por el marco duodenal y es retroperitoneal", "Su cola termina contra la cara posterior del estómago", "Su irrigación depende únicamente de la arteria gástrica izquierda"], "c": 1, "fb": "La cabeza del páncreas queda dentro de la curva del duodeno y es retroperitoneal. La cola llega al hilio del bazo."}, {"a": "dig", "q": "Elige la oración que sea correcta respecto al páncreas", "o": ["El 99% son células exocrinas, llamados acinos y el 1% con células endocrinas llamadas islotes.", "Las células Beta son las que secretan glucagón, permitiendo hacer la gluconeogénesis", "La hormona del crecimiento humano (GH) y la adrenocorticotrofina (ACTH), no son capaces de estimular la secreción de insulina en el cuerpo.", "La somatostatina ayuda a la liberación de insulina y glucagón."], "c": 0, "fb": "Los acinos exocrinos forman la gran mayoría del páncreas y los islotes endocrinos el 1%. Las beta secretan insulina y la somatostatina inhibe insulina y glucagón."}, {"a": "dig", "q": "¿Cuáles son los conductos del páncreas?", "o": ["conducto accesorio y de treitz", "conducto pancreático y hepático", "conducto de wirsung y accesorio", "conducto de vater y wirsung"], "c": 2, "fb": "El páncreas tiene el conducto de Wirsung (principal) y el accesorio (de Santorini)."}, {"a": "dig", "q": "Cual es la afirmación incorrecta acerca del páncreas", "o": ["es una glándula retroperitoneal de 2,5 cm de espesor", "conecta con el yeyuno por medio de dos conductos", "sus jugos pancreaticos son secretados por células exocrinas", "el conducto de wirsung se une al colédoco del hígado"], "c": 1, "fb": "Los conductos pancreáticos desembocan en el duodeno, no en el yeyuno."}, {"a": "dig", "q": "Estas arterias son importantes ya que permiten distribuir las hormonas que va a secretar el páncreas a todo el sistema.", "o": ["Arteria hepática propia, arteria gástrica izquierda y gástrica derecha.", "Arteria ileocólica e ileales y arteria gástrica cortas", "Arteria pancreatoduodenal inferior, Arteria pancreática y gástrica corta", "Arteria Pancreatoduodenal inferior, Arteria Pancreática y Arteria gastroduodenal."], "c": 3, "fb": "Reactivo mal redactado. El páncreas recibe sangre de las pancreatoduodenales (de la gastroduodenal y la AMS) y de ramas pancreáticas de la esplénica; la d es la opción que reúne esa irrigación."}, {"a": "dig", "q": "¿Qué plexo del sistema nervioso autónomo inerva el tubo digestivo?", "o": ["plexo sacro", "plexo pelviano", "plexo lumbar", "plexo braquial"], "c": 1, "fb": "Reactivo mal redactado, tal como viene en el examen. El tubo digestivo se inerva por los plexos entéricos (de Auerbach y de Meissner), que no aparecen en las opciones. De las opciones, la única autonómica es el plexo pelviano (hipogástrico inferior), que lleva fibras al colon distal y al recto; los plexos sacro, lumbar y braquial son somáticos."}, {"a": "dig", "q": "¿Dónde se encuentra la papila duodenal mayor?", "o": ["9 cm debajo del ángulo de treitz", "4 cm debajo del esfínter esofágico", "4 cm debajo del esfínter pilórico", "en la parte media del duodeno"], "c": 3, "fb": "Reactivo mal redactado, tal como viene en el examen. La papila duodenal mayor está en la segunda porción (descendente) del duodeno, en su pared posteromedial, a unos 8-10 cm del píloro, es decir, en la parte media del duodeno. Ojo: si tu doctora marca la c («4 cm debajo del esfínter pilórico») en su clave, no coincide con la distancia que dan los textos clásicos."}, {"a": "rep", "q": "¿En qué región anatómica del ovario se localizan predominantemente los folículos ováricos en sus distintas etapas de desarrollo?", "o": ["Médula ovárica", "Corteza ovárica", "Hilio ovárico", "Mesoovario"], "c": 1, "fb": "Los folículos ováricos en sus distintas etapas están en la corteza ovárica."}, {"a": "rep", "q": "¿Cuál de las siguientes descripciones anatómicas del ovario es completamente correcta?", "o": ["La médula ovárica está compuesta principalmente por tejido epitelial y contiene los ovocitos", "La corteza ovárica carece de vascularización significativa y solo contiene tejido conectivo denso", "La médula ovárica contiene vasos sanguíneos, nervios y tejido conectivo laxo, mientras que la corteza contiene los folículos", "El epitelio germinal es una capa gruesa de tejido conectivo que protege al ovario"], "c": 2, "fb": "La médula ovárica tiene vasos, nervios y tejido conectivo laxo; la corteza contiene los folículos."}, {"a": "rep", "q": "Respecto a la organización anatómica de la mama, ¿cuál afirmación es correcta?", "o": ["Los lóbulos mamarios drenan directamente a la dermis", "Los conductos galactóforos desembocan en el pezón", "Los ligamentos de Cooper producen leche", "La areola carece de glándulas"], "c": 1, "fb": "Los conductos galactóforos llevan la leche al pezón."}, {"a": "rep", "q": "¿Cuál es la estructura anatómica mamaria encargada principalmente de proporcionar el soporte interno de la glándula?", "o": ["Lóbulos mamarios", "Ligamentos de Cooper", "Conductos galactóforos", "Areola"], "c": 1, "fb": "Los ligamentos de Cooper dan el soporte interno a la glándula mamaria."}, {"a": "rep", "q": "¿Cuál afirmación es correcta sobre la mama?", "o": ["Los ligamentos de Cooper producen secreciones", "El tejido adiposo mamario contribuye al volumen y al contorno al rodear las estructuras glandulares.", "Los lóbulos sostienen estructuralmente la mama", "Los conductos forman la fascia profunda"], "c": 1, "fb": "El tejido adiposo rodea las estructuras glandulares y da volumen y contorno a la mama."}, {"a": "uri", "q": "¿Qué estructuras forman las pirámides renales dentro de la médula renal?", "o": ["Las columnas renales", "Los cálices mayores", "Los conductos papilares", "El seno renal"], "c": 2, "fb": "Las pirámides se forman por túbulos rectos y conductos papilares (colectores). Las columnas renales son corteza entre pirámides. Reactivo ambiguo; esta es la opción más cercana."}, {"a": "uri", "q": "¿A través de qué estructura entra la sangre inicialmente al riñón antes de dividirse en arterias segmentarias?", "o": ["Arteria renal", "Vena renal", "Arterias interlobulares", "Arterias arciformes"], "c": 0, "fb": "La sangre entra al riñón por la arteria renal, que se divide en arterias segmentarias."}, {"a": "uri", "q": "¿Qué componentes en la neurona conforman el corpúsculo renal?", "o": ["El túbulo contorneado proximal y el distal", "El glomérulo y la cápsula glomerular", "El asa de Henle y el túbulo colector", "La arteriola aferente y eferente"], "c": 1, "fb": "El corpúsculo renal = glomérulo + cápsula glomerular (de Bowman)."}, {"a": "uri", "q": "¿Cuál es el nombre del aparato que ayuda a regular la presión arterial dentro de los riñones y se forma por el contacto del asa de Henle con la arteriola aferente?", "o": ["Aparato de filtración", "Aparato yuxtaglomerular", "Corpúsculo renal", "Red capilar peritubular"], "c": 1, "fb": "El aparato yuxtaglomerular (mácula densa y células yuxtaglomerulares) ayuda a regular la presión arterial."}, {"a": "uri", "q": "Tipo de neuronas que tienen asas de Henle largas y que reciben su irrigación de los vasos rectos:", "o": ["Nefronas corticales", "Nefronas de asa corta", "Nefronas superficiales", "Nefronas yuxtamedulares"], "c": 3, "fb": "Las nefronas yuxtamedulares tienen asas de Henle largas y se irrigan por los vasos rectos."}, {"a": "rep", "q": "¿Qué estructura del cordón espermático contiene la sangre venosa proveniente del testículo?", "o": ["Arteria cremastérica", "Plexo pampiniforme", "Conducto deferente", "Nervio genitofemoral"], "c": 1, "fb": "El plexo pampiniforme es la red venosa del cordón espermático que drena el testículo."}, {"a": "rep", "q": "¿Cuál es una función endocrina del testículo?", "o": ["Producción de inhibina B por células de Leydig", "Producción de testosterona por células intersticiales", "Secreción de FSH por células de Sertoli", "Producción de GnRH en los túbulos seminíferos"], "c": 1, "fb": "Las células intersticiales (de Leydig) producen testosterona; la inhibina B es de las células de Sertoli."}, {"a": "rep", "q": "¿Qué estructura actúa como punto central de inserción muscular en el periné?", "o": ["Diafragma urogenital", "Cuerpo perineal", "Esfínter anal externo", "Fascia de Colles"], "c": 1, "fb": "El cuerpo perineal es el punto central de inserción muscular del periné."}, {"a": "uri", "q": "¿Cuál de los siguientes músculos contribuye directamente a la continencia urinaria voluntaria?", "o": ["Detrusor", "Esfínter uretral interno", "Esfínter uretral externo", "Músculo iliococcígeo"], "c": 2, "fb": "El esfínter uretral externo es de músculo estriado y permite la continencia voluntaria."}, {"a": "rep", "q": "¿Qué estructura divide al periné en triángulo urogenital y triángulo anal?", "o": ["Línea entre espinas isquiáticas", "Línea entre tuberosidades isquiáticas", "Ligamento anococcígeo", "Diafragma pélvico"], "c": 1, "fb": "La línea entre las tuberosidades isquiáticas separa el triángulo urogenital (anterior) del anal (posterior)."}, {"a": "uri", "q": "¿Quién impulsa la orina hasta la uretra?", "o": ["Uréteres", "Vejiga", "Riñones", "Hígado"], "c": 1, "fb": "La vejiga, al contraer el detrusor, impulsa la orina hacia la uretra."}, {"a": "uri", "q": "¿Cuál de las siguientes opciones no forma parte de la vía del flujo sanguíneo de los riñones?", "o": ["Venas arciformes", "Venas interlobulares", "Arteriolas aferentes", "Arteria gastrointestinal"], "c": 3, "fb": "La «arteria gastrointestinal» no existe en la circulación renal (arteria renal → segmentarias → interlobulares → arciformes → aferentes)."}, {"a": "rep", "q": "¿Para qué sirven los túbulos de la glándula mamaria?", "o": ["Para almacenar leche", "Para transportar leche", "Para producir leche", "Para sostener la glándula mamaria"], "c": 1, "fb": "Los túbulos (conductos) de la glándula mamaria transportan la leche hacia el pezón."}, {"a": "rep", "q": "¿En cuál de los siguientes cuadrantes de la glándula mamaria es más frecuente la localización de tumores?", "o": ["Cuadrante inferior interno", "Cuadrante superior externo", "Cuadrante superior interno", "Cuadrante inferior medio"], "c": 1, "fb": "El cuadrante superior externo es donde más se localizan los tumores de mama."}, {"a": "rep", "q": "¿Cuál de los siguientes es un factor de riesgo modificable de cáncer de mama?", "o": ["Lactancia prolongada", "Obesidad posmenopáusica", "Edad avanzada (+40 años)", "Sexo femenino"], "c": 1, "fb": "La obesidad posmenopáusica es un factor de riesgo modificable; edad y sexo no lo son, y la lactancia es protectora."}, {"a": "uri", "q": "La cápsula que rodea directamente el parénquima renal y le confiere su aspecto liso característico es:", "o": ["Cápsula adiposa", "Cápsula renal (fibrosa)", "Fascia renal de Gerota", "Peritoneo parietal"], "c": 1, "fb": "La cápsula renal (fibrosa) rodea el parénquima y da el aspecto liso; la adiposa y la fascia de Gerota son capas externas."}, {"a": "uri", "q": "Las pirámides renales se localizan en:", "o": ["Corteza renal", "Médula renal", "Hilio renal", "Pelvis renal"], "c": 1, "fb": "Las pirámides renales forman la médula renal."}, {"a": "uri", "q": "Las columnas de Bertin son extensiones de:", "o": ["Corteza renal entre las pirámides", "Médula renal", "Cápsula adiposa", "Pelvis renal"], "c": 0, "fb": "Las columnas de Bertin son corteza renal entre las pirámides."}, {"a": "uri", "q": "Los riñones son órganos retroperitoneales que se localizan a nivel de las vértebras:", "o": ["T10 a T12", "T12 a L3", "L3 a L5", "L4 a S1"], "c": 1, "fb": "Los riñones retroperitoneales se localizan de T12 a L3."}, {"a": "uri", "q": "Por el hilio renal entran y salen, en orden anteroposterior, las siguientes estructuras:", "o": ["Vena renal, arteria renal, pelvis renal", "Arteria renal, vena renal, pelvis renal", "Pelvis renal, vena renal, arteria renal", "Arteria renal, pelvis renal, vena renal"], "c": 0, "fb": "En el hilio, de anterior a posterior: vena renal, arteria renal y pelvis renal."}, {"a": "uri", "q": "Una niña de 8 años con tumor de Wilms en el riñón izquierdo requiere nefrectomía. Al ligar la vena renal izquierda, el cirujano debe considerar las tributarias adicionales que la diferencian de la derecha. ¿Cuál de las siguientes venas drena directamente en la vena renal izquierda?", "o": ["Vena suprarrenal derecha", "Vena gonadal izquierda", "Vena ácigos", "Vena hepática izquierda"], "c": 1, "fb": "La vena renal izquierda recibe a la gonadal izquierda (y a la suprarrenal izquierda); la derecha drena directo a la cava."}, {"a": "uri", "q": "Una mujer de 35 años requiere  menores → Cálices mayores → Uréter", "Cálices menores → Cálices mayores → Pelvis renal → Uréter", "Cálices menores → Pelvis renal → Cálices mayores → Uréter Uréteres"], "c": 2, "fb": "Flujo de orina: cálices menores → cálices mayores → pelvis renal → uréter."}, {"a": "uri", "q": "¿Cuál es el trayecto anatómico correcto de los uréteres desde la pelvis renal hasta la vejiga urinaria?", "o": ["Retroperitoneal, descienden sobre el músculo psoas mayor y cruzan los vasos ilíacos", "Intraperitoneal, descienden por delante del intestino delgado", "Retroperitoneal, descienden sobre el músculo recto abdominal", "Intraperitoneal, cruzan por detrás del hígado y el bazo"], "c": 0, "fb": "Los uréteres son retroperitoneales, bajan sobre el psoas mayor y cruzan los vasos ilíacos."}, {"a": "uri", "q": "La capacidad promedio de la vejiga se encuentra entre los 700 a 800 ml, sabiendo esto ¿Por qué la mujer tiene menos capacidad de retención de orina en la vejiga?", "o": ["Porque la uretra femenina es más corta, lo que reduce la presión intravesical", "Porque el útero ocupa el espacio superior y limita la expansión vesical", "Porque el músculo detrusor femenino tiene menor fuerza contráctil.", "Porque la inervación parasimpática vesical es menos eficiente en la mujer"], "c": 1, "fb": "En la mujer el útero ocupa el espacio sobre la vejiga y limita su expansión."}, {"a": "uri", "q": "Estructura alrededor de la mucosa de la vejiga en la capa muscular intermedia que se contrae para empujar la orina hacia la uretra.", "o": ["Músculo detrusor", "Solo la capa longitudinal interna del músculo detrusor", "Esfínter uretral interno", "Lámina propia de la mucosa"], "c": 0, "fb": "El músculo detrusor es la capa muscular media que se contrae para expulsar la orina."}, {"a": "uri", "q": "Capa superficial de la vejiga sobre la superficie posterior e inferior que se continúa con el tejido conectivo areolar de los uréteres.", "o": ["Peritoneo visceral", "Fascia vesical", "Lámina propia submucosa", "Adv mperatura corporal."}, {"a": "rep", "q": "El conducto deferente asciende por el borde posterior del epidídimo y recorre un trayecto específico antes de llegar a la uretra. ¿Cuál de las siguientes descripciones de su trayecto dentro de la cavidad pelviana es correcta?", "o": ["Pasa por debajo del uréter y luego asciende por el costado de la vejiga urinaria", "Gira por encima del uréter y pasa por el costado y por debajo de la cara inferior de la vejiga urinaria", "Cruza anteriormente al uréter y asciende por la cara lateral de la próstata", "Rodea el uréter en sentido posterior y desciende directamente hacia la próstata sin pasar cerca de la vejiga"], "c": 1, "fb": "El conducto deferente pasa por encima del uréter y baja por el costado y la cara inferior de la vejiga."}, {"a": "rep", "q": "Respecto a la disposición de las capas musculares del conducto deferente, ¿cuál de las siguientes opciones es correcta?", "o": ["Tres capas: circular interna, longitudinal media y circular externa", "Dos capas: longitudinal interna y circular externa, igual que los uréteres", "Tres capas: longitudinal interna, circular media y longitudinal externa", "Tres capas: circular interna, longitudinal media y longitudinal externa"], "c": 2, "fb": "Muscular del conducto deferente: longitudinal interna, circular media y longitudinal externa."}, {"a": "rep", "q": "¿Cuál de las siguientes afirmaciones sobre los ovarios es CORRECTA", "o": ["Los ovarios son órganos retroperitoneales localizados en la cavidad abdominal superior", "Los ovarios producen únicamente ovocitos y no participan en funciones endocrinas", "Los ovarios se localizan a cada lado del útero y producen hormonas como estrógenos y progesterona", "Los ovarios están unidos directamente a la pared abdominal anterior por el ligamento redondo."], "c": 2, "fb": "Los ovarios están a cada lado del útero y producen estrógenos y progesterona."}, {"a": "rep", "q": "¿Cuál de las siguientes afirmaciones sobre la estructura de los ovarios es INC : ["Ilíaca externa", "Epigástrica inferior", "Umbilical", "Testicular"], "c": 3, "fb": "La arteria testicular irriga el testículo; su obstrucción por aterosclerosis reduce la producción de espermatozoides."}, {"a": "rep", "q": "Un hombre de 35 años se somete a una hernioplastia abierta por una hernia inguinal indirecta incarcerada. Durante la operación, se identifica el cordón espermático y el músculo oblicuo interno del abdomen. ¿qué cubierta del cordón espermático se deriva del músculo oblicuo interno del abdomen?", "o": ["Túnica vaginal", "Músculo cremáster", "Fascia espermática interna", "Fascia espermática externa"], "c": 1, "fb": "El cremáster deriva del oblicuo interno; la fascia espermática externa del oblicuo externo y la interna de la fascia transversalis."}, {"a": "rep", "q": "Una mujer de 25 años es llevada al servicio de urgencias por un dolor repentino y agudo en el cuadrante inferior izquierdo. Refiere que su último período menstrual fue hace 10 días. La prueba de embarazo es negativa. Una ecografía transvaginal muestra la rotura de un quiste en el ovario izquierdo, que provocó la aparición de aproximadamente 100 ml de líquido en la pelvis. ¿En cuál de los siguientes espacios es más probable que se acumule líquido?", "o": ["Espacio de Morrison", "Bolsa vesicouterina", "Espacio retrouterino (de Douglas)"], "c": 2, "fb": "El líquido libre en la pelvis femenina se acumula en el espacio retrouterino (de Douglas), el punto más declive. El de Morrison es hepatorrenal."}, {"a": "rep", "q": "De las glándulas bulbouretrales, señale cuál es la estructura homóloga en el aparato reproductor femenino:", "o": ["Ovarios", "Glándulas parauretrales", "Glándulas vestibulares mayores"], "c": 2, "fb": "Las bulbouretrales son homólogas de las vestibulares mayores (de Bartolini)."}, {"a": "rep", "q": "Ayudan a regular la temperatura de los testículos:", "o": ["Túnica vaginal y túnica albugínea", "Músculo cremáster y dartos", "Células intersticiales de Leydig"], "c": 1, "fb": "El cremáster y el dartos acercan o alejan los testículos del cuerpo para mantener su temperatura."}, {"a": "uri", "q": "Se considera la unidad funcional de los riñones:", "o": ["Aparato yuxtaglomerular", "Túbulo renal", "Nefrona", "Corpúsculo renal"], "c": 2, "fb": "La nefrona (corpúsculo renal + túbulo) es la unidad funcional del riñón."}, {"a": "uri", "q": "Acerca de la anatomía de los riñones, señale la oración incorrecta:", "o": ["Son órganos retroperitoneales", "Se localizan posterior al peritoneo", "Se apoya sobre L1 y L2", "Son órganos sólidos rojizos"], "c": 2, "fb": "Los riñones se extienden de T12 a L3, no solo sobre L1 y L2. En tu examen la b estaba marcada como incorrecta (es verdadera: son retroperitoneales). Reactivo ambiguo; esta es la opción más defendible."}, {"a": "rep", "q": "De la próstata señale, cuál es la estructura homóloga en el aparato reproductor femenino:", "o": ["Ovarios", "Glándulas parauretrales", "Glándulas vestibulares mayores"], "c": 1, "fb": "La próstata es homóloga de las glándulas parauretrales (de Skene)."}, {"a": "uri", "q": "Esta capa es la encargada de sujetar los riñones a las estructuras vecinas y a la pared abdominal. Señale la respuesta correcta:", "o": ["Cápsula renal", "Cápsula adiposa", "Fascia renal"], "c": 2, "fb": "La fascia renal fija el riñón a las estructuras vecinas y a la pared abdominal."}, {"a": "uri", "q": "Un hombre de 32 años acude a urgencias con dolor intenso en el hipocondrio izquierdo que se irradia hacia la parte inferior de la espalda. La exploración física muestra manchas de sangre en su ropa interior y el posterior análisis de orina dio positivo en sangre. Una ecografía del abdomen muestra que los uréteres son de tamaño normal, pero la pelvis renal izquierda aparece agrandada y los cálices renales estaban redondeados y embotados a causa de un cálculo renal. ¿Cuál es la localización más probable del cálculo?", "o": ["uréter en la unión ureteropélvica", "uréter en la unión ureterovesical", "uréter en el borde del estrecho pélvico"], "c": 0, "fb": "Uréteres normales con pelvis y cálices dilatados indican obstrucción en la unión ureteropélvica."}, {"a": "uri", "q": "Un hombre de 68 años acude a urgencias por dolor al orinar. La imagen y la posterior biopsia muestran un tumor originado en el revestimiento de la vejiga urinaria. Durante la resección transuretral del tumor, el citoscopio (instrumento médico en forma de tubo delgado, con una luz y una cámara o lente, que se utiliza para examinar el interior de la uretra y la vejiga en un procedimiento llamado cistoscopia) entra en la vejiga urinaria. ¿Cuál de las siguientes estructuras atravesará él citoscopio inmediatamente antes de entrar en la vejiga?", "o": ["Uretra esponjosa", "uretra prostática", "porción intramural de la uretra", "parte membranosa de la uretra"], "c": 2, "fb": "Según la clave de tu examen (marcada correcta): la porción intramural es la que atraviesa la pared vesical justo antes de entrar a la vejiga."}, {"a": "rep", "q": "Irriga la porción distal del útero y el cuello uterino:", "o": ["arteria ovárica", "arteria uterina", "arteria iliaca externa"], "c": 1, "fb": "La arteria uterina irriga el útero y el cuello uterino."}, {"a": "uri", "q": "El uréter se encuentra directamente posterior al ligamento infundibulopélvico, cerca de la hoja medial del ligamento ancho. La oración es falsa o verdadera.", "o": ["FALSA", "VERDADERA"], "c": 1, "fb": "VERDADERA: por eso al ligar los vasos ováricos hay que identificar el uréter."}, {"a": "rep", "q": "Se consideran homólogas de las glándulas bulbouretrales masculinas:", "o": ["Glándulas de Bartolini", "Glándulas de Skene", "Clítoris"], "c": 0, "fb": "Las glándulas de Bartolini (vestibulares mayores) son las homólogas."}, {"a": "sen", "q": "¿Cómo se le llama a las células neuronales de primer orden de la vía olfatoria, que son capaces de captar los olores olfatorios?", "o": ["bulbo olfatorio", "Células receptoras olfatorias", "Células de sostén", "Células mitrales."], "c": 1, "fb": "Las células receptoras olfatorias son las neuronas de primer orden que captan los odorantes."}, {"a": "sen", "q": "Esta estructura del ojo se encuentra dentro de la pupila y del iris dentro de la cavidad del glóbulo ocular.", "o": ["Cristalino", "Córnea", "Retina", "Cámara vítrea"], "c": 0, "fb": "El cristalino queda justo detrás de la pupila y del iris."}, {"a": "sen", "q": "Este es una sustancia transparente tipo gel que mantiene la retina pegada a la coroides y le da una superficie uniforme para la recepción de imágenes claras. Este se encuentra en la cámara vítrea, no cuenta con recambio.", "o": ["Humor vítreo", "Humor acuoso", "Fibras zonulares", "Iris"], "c": 0, "fb": "El humor vítreo es un gel transparente de la cámara vítrea que mantiene la retina contra la coroides y no se recambia."}, {"a": "sen", "q": "Identifica la correcta organización de la vía visual", "o": ["1. Nervio óptico - 2. Quiasma óptico - 3. Tracto óptico - 4. Núcleo geniculado lateral 5. Radiación óptica - 6. Área visual primaria (área 17).", "1. Núcleo geniculado lateral - 2. Radiación óptica - 3. Área visual primaria (área 17) 3. Nervio óptico - 4. Quiasma óptico - 5. Tracto óptico.", "1. Quiasma óptico - 2. Tracto óptico - 3. Núcleo geniculado lateral - 4. Radiación óptica - 5. Área visual primaria (área 17) - 6. Nervio óptico.", "1. Núcleo geniculado lateral - 2. Área visual primaria (área 17) - 3. Nervio óptico - 4. Quiasma óptico - 5. Tracto óptico - 6. Radiación óptica."], "c": 0, "fb": "Vía visual: nervio óptico → quiasma → tracto óptico → núcleo geniculado lateral → radiación óptica → área visual primaria (área 17)."}, {"a": "sen", "q": "Un paciente llega a consulta porque presenta visión doble al intentar mirar hacia un lado. Durante la exploración, se observa que uno de sus ojos no puede moverse hacia afuera más allá de la línea media y permanece desviado hacia adentro. ¿Qué par craneal está lesionado?", "o": ["III", "IV", "VI", "VII"], "c": 2, "fb": "Un ojo que no se mueve hacia afuera y queda desviado hacia adentro indica parálisis del recto lateral, inervado por el abducens (VI)."}, {"a": "sen", "q": "Una mujer de 50 años presenta diplopía vertical y dificultad para mirar hacia abajo y hacia adentro con el ojo derecho. ¿Qué músculo extrínseco del ojo está paralizado y qué nervio craneal lo inerva?", "o": ["Recto superior - Oculomotor (III)", "Oblicuo superior - Troclear (IV)", "Recto lateral - Abducens (VI)", "Oblicuo inferior - Oculomotor(III)"], "c": 1, "fb": "El oblicuo superior, inervado por el troclear (IV), mueve el ojo hacia abajo y adentro; su parálisis causa diplopía vertical."}, {"a": "sen", "q": "¿Cuál es la capa más interna del ojo, encargada de la fotorrecepción?", "o": ["Esclerótica", "Coroides", "Retina", "Conjuntiva bulbar"], "c": 2, "fb": "La retina es la capa más interna del ojo y contiene los fotorreceptores."}, {"a": "sen", "q": "El humor acuoso se produce en:", "o": ["Procesos ciliares del cuerpo ciliar", "Cristalino", "Cuerpo vítreo", "Retina periférica"], "c": 0, "fb": "El humor acuoso lo producen los procesos ciliares del cuerpo ciliar."}, {"a": "sen", "q": "Un hombre de 60 años acude por dolor ocular intenso, visión borrosa con halos alrededor de las luces, midriasis fija y aumento súbito de la presión intraocular. Se diagnostica glaucoma agudo de ángulo cerrado. La obstrucción al drenaje del humor acuoso se localiza en:", "o": ["Conducto nasolagrimal", "Canal de Schlemm en el ángulo iridocorneal", "Cristalino", "Nervio óptico"], "c": 1, "fb": "El humor acuoso drena por el canal de Schlemm en el ángulo iridocorneal; su obstrucción eleva la presión intraocular."}, {"a": "sen", "q": "¿Cuántos músculos extraoculares tiene el ojo humano?", "o": ["4 músculos", "6 músculos", "7 músculos", "8 músculos"], "c": 1, "fb": "Cada ojo tiene 6 músculos extraoculares."}, {"a": "sen", "q": "¿Qué nervio inerva al músculo recto lateral del ojo?", "o": ["Oculomotor (III)", "Troclear (IV)", "Abducens (VI)", "Oftálmico (V1)"], "c": 2, "fb": "El recto lateral está inervado por el abducens (VI)."}, {"a": "sen", "q": "Los huesecillos del oído medio, en orden desde la membrana timpánica hasta la ventana oval, son:", "o": ["Yunque, martillo, estribo", "Martillo, yunque, estribo", "Estribo, yunque, martillo", "Martillo, estribo, yunque"], "c": 1, "fb": "De la membrana timpánica a la ventana oval: martillo, yunque y estribo."}, {"a": "sen", "q": "Un paciente con cuadro gripal refiere sensación de “oído tapado” que mejora al deglutir o bostezar. ¿Qué estructura anatómica permite el equilibrio de presiones entre el oído medio y el ambiente?", "o": ["Conducto auditivo externo", "Trompa de Eustaquio", "Ventana oval", "Conducto coclear"], "c": 1, "fb": "La trompa de Eustaquio iguala la presión entre el oído medio y el exterior (se destapa al deglutir o bostezar)."}, {"a": "sen", "q": "¿Qué estructura del oído interno es responsable de la audición?", "o": ["Conductos semicirculares", "Utrículo y sáculo", "Cóclea", "Trompa de Eustaquio"], "c": 2, "fb": "La cóclea (oído interno) es el órgano de la audición."}, {"a": "sen", "q": "¿Cuál de las siguientes papilas linguales se caracteriza por tener una función principalmente mecánica y carecer de botones gustativos?", "o": ["Papilas fungiformes", "Papilas circunvaladas", "Papilas foliadas", "Papilas filiformes"], "c": 3, "fb": "Las papilas filiformes son mecánicas y no tienen botones gustativos."}, {"a": "sen", "q": "Respecto al utrículo y sáculo, señale la afirmación correcta:", "o": ["Son receptores auditivos ubicados en la cóclea", "Detectan cambios en la presión del sonido en el oído medio", "Contienen receptores que detectan la posición de la cabeza y la aceleración lineal", "Son estructuras del oído externo encargadas de la conducción del sonido"], "c": 2, "fb": "El utrículo y el sáculo detectan la posición de la cabeza y la aceleración lineal (equilibrio estático)."}, {"a": "sen", "q": "Es el área ocular con más agudeza central:", "o": ["Fóvea central", "Mácula lútea", "Disco óptico", "Tracto Óptico"], "c": 0, "fb": "La fóvea central, en el centro de la mácula lútea, es la zona de mayor agudeza visual."}, {"a": "sen", "q": "¿Cuál es la característica correcta del procesamiento de las sensaciones olfatorias?", "o": ["Todas las señales olfatorias hacen relevo primero en el tálamo antes de llegar a la corteza", "Las señales olfatorias llegan directamente a la corteza cerebral sin pasar primero por el tálamo", "Las señales olfatorias se procesan únicamente en el cerebelo", "Las señales olfatorias hacen relevo primero en el tronco encefálico"], "c": 1, "fb": "El olfato es la única vía sensorial que llega a la corteza sin relevo previo en el tálamo."}, {"a": "sen", "q": "Un hombre de 62 años acude al servicio de urgencias debido a la pérdida de visión en su ojo derecho. La exploración física muestra que, cuando se ilumina el ojo derecho, no se observa constricción pupilar. ¿Cuál de los siguientes nervios craneales está afectado más probablemente?", "o": ["V", "III", "II", "VIII"], "c": 2, "fb": "El reflejo pupilar de un ojo ciego requiere la vía aferente: el nervio óptico (II)."}, {"a": "sen", "q": "¿Cuál es el nombre de las estructuras de sustancia gris donde terminan los nervios olfatorios?", "o": ["Quiasma óptico", "Bulbos olfatorios", "Tractos olfatorios", "Ganglio ciliar"], "c": 1, "fb": "Los nervios olfatorios terminan en los bulbos olfatorios, de sustancia gris."}, {"a": "sen", "q": "Receptores de la piel localizadas en la capa más profunda de la epidermis, responsables de la sensación de tacto sostenido, presión y discriminación de formas y texturas.", "o": ["Corpusculos de Meissner", "Corpúsculos de Pacini", "Terminaciones nerviosas libres", "Discos de Merkel"], "c": 3, "fb": "Los discos de Merkel están en la capa basal de la epidermis y detectan tacto sostenido, presión y texturas."}, {"a": "sen", "q": "¿En qué región del ojo se localiza la ora serrata?", "o": ["Entre la retina y el cuerpo ciliar", "Entre la córnea y la esclerótica", "Entre la mácula y el disco óptico", "Entre el iris y el cristalino"], "c": 0, "fb": "La ora serrata es el borde anterior de la retina, donde se une con el cuerpo ciliar."}, {"a": "sen", "q": "Un paciente de 52 años sufre un traumatismo ocular directo. En la exploración se observa una opacidad en la región inmediatamente posterior al iris. El resto de las estructuras anteriores se encuentran intactas. ¿Qué estructura anatómica está más probablemente afectada?", "o": ["Córnea", "Esclerótica", "Cristalino", "Cuerpo vítreo"], "c": 2, "fb": "La opacidad justo detrás del iris corresponde al cristalino."}, {"a": "sen", "q": "¿Cuál de las siguientes estructuras forma parte de la túnica vascular del ojo y participa directamente en la producción del humor acuoso?", "o": ["Retina", "Esclerótica", "Cristalino", "Cuerpo ciliar"], "c": 3, "fb": "El cuerpo ciliar forma parte de la túnica vascular (úvea) y produce el humor acuoso."}, {"a": "sen", "q": "¿Cuál de las siguientes estructuras se localiza en el centro de la mácula lútea?", "o": ["Ora serrata", "Disco óptico", "Fóvea central", "Cuerpo ciliar"], "c": 2, "fb": "La fóvea central ocupa el centro de la mácula lútea."}, {"a": "sen", "q": "¿Cuál es la función principal de la trompa auditiva (trompa de Eustaquio) en el sistema auditivo?", "o": ["Transmitir y amplificar las vibraciones desde la membrana timpánica hacia la ventana oval", "Ecualizar la presión del aire a ambos lados de la membrana timpánica", "Recoger las ondas sonoras y canalizarlas hacia el conducto auditivo externo", "Producir el cerumen para prevenir que el polvo y objetos extraños entren en el oído"], "c": 1, "fb": "La trompa auditiva iguala la presión del aire a ambos lados de la membrana timpánica."}, {"a": "sen", "q": "Sobre los órganos del aparato vestibular y su función, ¿cuál de las siguientes afirmaciones es correcta?", "o": ["Los conductos semicirculares son los encargados de detectar la aceleración lineal en dirección vertical", "El sáculo detecta principalmente la aceleración o desaceleración lineal que ocurre en un plano horizontal", "El utrículo detecta la aceleración lineal horizontal y la inclinación de la cabeza, mientras que el sáculo responde a la aceleración lineal vertical", "Las crestas, que contienen los receptores para el equilibrio rotacional, se localizan dentro de las máculas del utrículo y el sáculo"], "c": 2, "fb": "El utrículo detecta la aceleración lineal horizontal y el sáculo la vertical; los conductos semicirculares detectan la rotación."}, {"a": "sen", "q": "Un joven de 20 años durante un viaje en crucero comienza a sentir náuseas intensas, mareo, palidez y sudoración fría. Al cerrar los ojos y descansar en su camarote, los síntomas persisten. ¿Cuál es la explicación fisiológica más probable para este cuadro de cinetosis?", "o": ["Un conflicto sensorial donde el aparato vestibular percibe el movimiento del barco, pero los ojos (al estar en el interior) informan al cerebro que el cuerpo está en una posición fija", "Una lesión en el nervio vestibulococlear (VIII) provocada por los cambios bruscos de presión atmosférica", "Un aumento excesivo en la producción de endolinfa dentro del conducto coclear debido al estrés del viaje", "El desprendimiento de los otolitos de la membrana otolítica, los cuales han ingresado a los conductos semicirculares"], "c": 0, "fb": "La cinetosis es un conflicto sensorial: el aparato vestibular percibe movimiento pero la vista informa que el cuerpo está quieto."}, {"a": "sen", "q": "Durante un estudio de imagen de un paciente con vértigo, se observa una malformación en la porción central del laberinto óseo. Si la lesión afecta la zona que conecta los conductos semicirculares con la cóclea, ¿en qué estructura anatómica se localiza el problema?", "o": ["En las ampollas de los conductos semicirculares anteriores", "En el conducto auditivo interno por donde pasa el nervio vestibulococlear", "En el vestíbulo, que constituye la porción central del laberinto óseo y contiene al utrículo y al sáculo", "En la membrana timpánica secundaria que cubre la ventana redonda"], "c": 2, "fb": "El vestíbulo es la porción central del laberinto óseo y contiene al utrículo y al sáculo."}, {"a": "sen", "q": "Sobre la anatomía de la vía auditiva, ¿cuál de las siguientes afirmaciones es correcta?", "o": ["Los axones de la rama coclear del nervio VIII terminan directamente en el tálamo", "El colículo inferior se localiza en la protuberancia (puente)", "El núcleo olivar superior es el primer lugar donde los impulsos nerviosos llegan al cerebelo", "El núcleo geniculado medial se encuentra en el tálamo y proyecta sus axones hacia el área auditiva primaria en el lóbulo temporal"], "c": 3, "fb": "El núcleo geniculado medial del tálamo proyecta al área auditiva primaria del lóbulo temporal."}, {"a": "sen", "q": "En una cirugía, el cirujano tiene que acceder a la cavidad craneal a través de la nariz, sin embargo, debe tener cuidado con la región superior de la cavidad nasal, en relación con el hueso etmoides ¿Cuál es la disposición anatómica correcta de las neuronas receptoras olfatorias ?", "o": ["Sus dendritas atraviesan la lámina perpendicular del etmoides.", "Sus axones atraviesan los forámenes olfatorios de la lámina cribosa.", "Sus cuerpos celulares se agrupan en el ganglio geniculado antes de entrar al cráneo.", "Sus axones forman el tracto olfatorio antes de cruzar la lámina cribosa."], "c": 1, "fb": "Los axones de las neuronas receptoras olfatorias atraviesan los forámenes de la lámina cribosa del etmoides."}, {"a": "sen", "q": "Se sabe que la lámina propia sostiene al epitelio olfatorio, y dentro de ella se encuentran las glándulas olfatorias (de Bowman), ¿Cuál es el trayecto de sus conductos y qué importancia tiene su secreción para la función del receptor?", "o": ["Sus conductos desembocan en los senos paranasales para humectar el aire inspirado.", "Sus conductos atraviesan el epitelio olfatorio hasta la superficie luminal, donde secretan un moco que disuelve las sustancias químicas (odorantes).", "Sus conductos conectan directamente con el bulbo olfatorio para nutrir a las células mitrales.", "Son glándulas endocrinas que liberan hormonas directamente al torrente sanguíneo para regular el umbral del olfato."], "c": 1, "fb": "Las glándulas de Bowman secretan moco que disuelve los odorantes en la superficie del epitelio olfatorio."}, {"a": "sen", "q": "El bulbo olfatorio se encuentra en el prosencéfalo, y este es el que recibe información sensorial ¿dime la relación anatómica correcta con respecto a las células mitrales?", "o": ["Son neuronas de primer orden situadas en la mucosa nasal.", "Son células de sostén que forman la barrera hematoencefálica en la nariz.", "Son neuronas de segundo orden cuyos axones forman el tracto olfatorio.", "Son glándulas exocrinas que producen moco para disolver odorantes."], "c": 2, "fb": "Las células mitrales son neuronas de segundo orden y sus axones forman el tracto olfatorio."}, {"a": "sen", "q": "Menciona la ubicación exacta y que estructura forman en la lengua las papilas caliciformes:", "o": ["Se distribuyen de forma aleatoria en los bordes laterales de la lengua.", "Se encuentran en la punta de la lengua formando un arco cóncavo.", "Se disponen en el tercio posterior de la lengua formando una hilera en forma de \"V\".", "Están enterradas en las criptas amigdalinas de la orofaringe."], "c": 2, "fb": "Las papilas caliciformes forman una «V» en el tercio posterior de la lengua."}, {"a": "sen", "q": "Un paciente presenta una pérdida de sensibilidad gustativa, específicamente en la epiglotis y la región de la garganta, ¿qué nervio craneal y qué núcleo del tronco del encéfalo están involucrados?", "o": ["Nervio Facial (VII) y Núcleo Geniculado.", "Nervio Glosofaríngeo (IX) y Núcleo Ventroposteromedial.", "Nervio Vago (X) y Núcleo del Tracto Solitario.", "Nervio Trigémino (V) y Núcleo Mesencefálico."], "c": 2, "fb": "El gusto de la epiglotis y la garganta lo lleva el vago (X), con relevo en el núcleo del tracto solitario."}];
const AREAS={dig:"Sistema digestivo",uri:"Sistema urinario",rep:"Gónadas y aparato reproductor",sen:"Órganos de los sentidos"};

  `<div class="row">Número de preguntas</div><select id="num"><option value="10">10</option><option value="20">20</option><option value="40">40</option><option value="0" selected>Todas</option></select>

  const p=pool[i];
  app.innerHTML=`<div class="meta"><span>Pregunta ${i+1} de ${pool.length}</span><span>${AREAS[p.a]}</span></div>
  <div class="bar"><i style="width:${i/pool.length*100}%"></i></div><p class="q">${esc(p.q)}</p>
  ${p.o.map((t,k)=>`<button class="opt" data-k="${k}">${L[k]}) ${esc(t)}</button>`).join("")}<div id="fb" hidden></div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>resp(+b.dataset.k));
}
function resp(k){
  const p=pool[i],bien=k===p.c;if(bien)ok++;else fails.push(p);
  app.querySelectorAll(".opt").forEach((b,n)=>{b.disabled=true;if(n===p.c)b.classList.add("ok");else if(n===k)b.classList.add("bad");});
  const f=document.getElementById("fb");f.hidden=false;f.className="fb";
  f.innerHTML=`<strong class="${bien?"ok":"bad"}">${bien?"Correcto.":"Incorrecto."}</strong> ${bien?"":`La respuesta es <strong>${L[p.c]}) ${esc(p.o[p.c])}</strong>.`}<p style="margin:8px 0 0">${esc(p.fb)}</p>
  <button class="btn" id="sig">${i<pool.length-1?"Siguiente":"Ver resultado"}</button>`;
  const s=document.getElementById("sig");s.onclick=()=>{i++;i<pool.length?ver():fin();};s.focus();
}
function fin(){
  app.innerHTML=`<div class="meta"><span>Resultado</span></div><div class="score">${ok} / ${pool.length}</div>
  <p>${Math.round(ok/pool.length*100)}% de aciertos.</p>
  <button class="btn" id="rep"${fails.length?"":" hidden"}>Repasar falladas (${fails.length})</button><button class="btn sec" id="ini">Volver al inicio</button>
  ${fails.map(p=>`<div class="rev">${esc(p.q)}<br><b>${L[p.c]}) ${esc(p.o[p.c])}</b></div>`).join("")}`;
  document.getElementById("ini").onclick=inicio;
  document.getElementById("rep").onclick=()=>empezar(fails.slice());
}
inicio();
</script></body></html>
