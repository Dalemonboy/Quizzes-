const app = document.getElementById("app");
const letras = ["a","b","c","d"];
let i = 0, aciertos = 0;

function mostrar() {
  const p = preguntas[i];
  app.innerHTML = `<div class="prog">Pregunta ${i+1} de ${preguntas.length}</div>
    <p class="q">${p.q}</p>
    <div id="opts">${p.o.map((t,k)=>`<button class="opt" data-k="${k}">${letras[k]}) ${t}</button>`).join("")}</div>
    <div id="fb" hidden></div>`;
  app.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => responder(+b.dataset.k)));
}

function responder(k) {
  const p = preguntas[i];
  const bien = k === p.c;
  if (bien) aciertos++;
  app.querySelectorAll(".opt").forEach((b, n) => {
    b.disabled = true;
    if (n === p.c) b.classList.add("ok");
    else if (n === k) b.classList.add("bad");
  });
  const fb = document.getElementById("fb");
  fb.hidden = false;
  fb.className = "fb";
  fb.innerHTML = `<strong class="${bien?"ok":"bad"}">${bien?"Correcto.":"Incorrecto."}</strong>
    ${bien ? "" : `La respuesta correcta es <strong>${letras[p.c]}) ${p.o[p.c]}</strong>.`}
    <p>${p.fb}</p><ul>${p.por.map(x=>`<li>${x}</li>`).join("")}</ul>
    <button class="btn" id="sig">${i < preguntas.length-1 ? "Siguiente pregunta" : "Ver resultado"}</button>`;
  document.getElementById("sig").addEventListener("click", () => {
    i++;
    i < preguntas.length ? mostrar() : final();
  });
  document.getElementById("sig").focus();
}

function final() {
  app.innerHTML = `<div class="prog">Resultado</div>
    <div class="score">${aciertos} / ${preguntas.length}</div>
    <p>${aciertos === preguntas.length ? "Excelente, dominas estos temas." : "Repasa la retroalimentación de las preguntas que fallaste e inténtalo de nuevo."}</p>
    <button class="btn" id="otra">Reintentar</button>`;
  document.getElementById("otra").addEventListener("click", () => { i = 0; aciertos = 0; mostrar(); });
}
mostrar();
</script>
