<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#5d6779;--bd:#dfe3ec;--ac:#2f6fed;--ok:#1f9d55;--okb:#e3f6ea;--no:#d33a3a;--nob:#fde8e8;--sh:0 2px 10px rgba(20,30,60,.07)}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2029;--tx:#e8ecf4;--mu:#98a2b5;--bd:#2c3442;--ac:#6b9bff;--ok:#4cd187;--okb:#16301f;--no:#ff7b7b;--nob:#3a1c1c;--sh:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:18px 14px 60px}
h1{font-size:1.5rem;margin:6px 0 4px}h2{font-size:1.15rem;margin:0 0 10px}
.sub{color:var(--mu);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--bd);border-radius:999px;cursor:pointer;background:var(--bg);font-size:.92rem;user-select:none}
.chip input{accent-color:var(--ac)}
.chip.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,var(--card))}
.chip small{color:var(--mu)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
select,button{font:inherit}
select{padding:8px 10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:var(--ac);color:#fff;font-weight:600}
button.sec{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
button:disabled{opacity:.5;cursor:not-allowed}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--mu);font-size:.9rem;margin-bottom:8px}
.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .25s}
.tag{display:inline-block;font-size:.78rem;padding:2px 10px;border-radius:99px;background:color-mix(in srgb,var(--ac) 14%,var(--card));color:var(--ac);margin-bottom:8px}
.q{font-size:1.08rem;font-weight:600;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1.5px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:9px;font-weight:400}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt.ok{border-color:var(--ok);background:var(--okb)}
.opt.no{border-color:var(--no);background:var(--nob)}
.opt:disabled{opacity:1;cursor:default}
.fb{border-radius:12px;padding:12px 14px;margin:12px 0;border-left:5px solid}
.fb.ok{background:var(--okb);border-color:var(--ok)}.fb.no{background:var(--nob);border-color:var(--no)}
.fb b{display:block;margin-bottom:3px}
.big{font-size:2.4rem;font-weight:800;margin:0}
.tr{display:grid;grid-template-columns:1fr 70px;gap:4px 12px;align-items:center;margin:8px 0}
.tr .b{height:10px;background:var(--bd);border-radius:99px;overflow:hidden}.tr .b i{display:block;height:100%}
.rev{border-top:1px solid var(--bd);padding-top:12px;margin-top:12px}
.rev p{margin:4px 0}
.hide{display:none}
</style>

<script>
var TOPICS=['2.4 Control postranscripcional','2.5 Traducción y estabilidad del mRNA','RNAi y RNA no codificante','3.2 Electroforesis e hibridación','3.3 Secuenciación y NGS','3.4 Repetidos, pseudogenes y duplicaciones','3.5–3.6 ADN recombinante y organismos modelo','3.13c Biomarcadores'];
var Q=[];
function q(t,s,c,w,e){Q.push({t:t,s:s,o:[c].concat(w),c:0,e:e,fx:0});}
function v(t,s,b,e){Q.push({t:t,s:s,o:['Verdadero','Falso'],c:b?0:1,e:e,fx:1});}
/* ===== TEMA 0: 2.4 Control postranscripcional ===== */
q(0,'¿Cuándo actúan los controles postranscripcionales de la expresión génica?','Después de que la RNA polimerasa se ancla al promotor e inicia la síntesis de RNA',['Antes de que la RNA polimerasa llegue al promotor','Solo después de que la proteína ya fue sintetizada','Únicamente durante la replicación del ADN'],'Los controles postranscripcionales operan una vez que la RNA polimerasa ya se unió al promotor y comenzó a sintetizar RNA; determinan cuánta proteína se hace y qué versión.');
q(0,'¿Cuál de las siguientes NO es una razón por la que debe regularse la expresión de los genes?','Aumentar el número de genes del genoma',['Ahorro de energía (activar solo los genes necesarios)','Adaptación al entorno (responder a señales externas)','Especialización y desarrollo celular'],'Las razones de la regulación son ahorro de energía, adaptación al entorno y especialización/desarrollo. La regulación no cambia el número de genes.');
q(0,'La ecuación “1 gen = múltiples mecanismos de control = múltiples proteínas” significa que…','Un mismo gen puede dar varias proteínas gracias a mecanismos como el splicing alternativo, la edición y el cambio de sitio de poliadenilación',['Cada proteína necesita varios genes distintos','Un gen solo puede dar una proteína','El número de genes es igual al número de proteínas'],'El control postranscripcional puede cambiar la secuencia de aminoácidos, por eso un gen puede originar varias proteínas.');
q(0,'¿Cuál es la función del capping (caperuza 5′)?','Proteger al mRNA de exonucleasas',['Remover los intrones','Añadir ~200 adeninas en el extremo 3′','Convertir adenina en inosina'],'La caperuza 5′ protege al mRNA de la degradación por exonucleasas y es una de las “marcas” de procesamiento exitoso.');
q(0,'La cola poli-A (~200 adeninas en 3′) sirve principalmente para…','Estabilizar el mRNA',['Marcar el sitio donde corta el spliceosoma','Codificar aminoácidos hidrofóbicos','Evitar que el mRNA salga al citosol'],'La poliadenilación estabiliza al mRNA y además funciona como un “reloj” de su vida media en el citosol.');
q(0,'El spliceosoma es…','Un complejo de enzimas y snRNPs que remueve intrones para generar mRNA maduro',['Una enzima única que añade el cap 5′','Un tipo de ribosoma que lee intrones','Un complejo que edita A a I'],'El spliceosoma está formado por proteínas y snRNPs (ribonucleoproteínas pequeñas nucleares) y elimina los intrones.');
q(0,'La atenuación de la transcripción consiste en…','Inhibir la expresión de un gen mediante la terminación prematura de la transcripción',['Aumentar la velocidad de elongación de la RNA polimerasa','Degradar el mRNA ya maduro en el citosol','Cortar los intrones del pre-mRNA'],'En la atenuación la transcripción se interrumpe antes de completar el RNA, dando un transcrito corto no funcional.');
q(0,'¿Cuál es el mecanismo de la atenuación?','El RNA naciente adopta una conformación que interactúa con la RNA polimerasa y aborta la transcripción',['La RNA polimerasa se une a otro promotor','El spliceosoma corta el RNA naciente','Los ribosomas se unen al RNA y lo degradan'],'Cuando la proteína es necesaria, otras proteínas se unen al RNA naciente y evitan esa interacción inhibitoria, permitiendo transcribir el mRNA completo.');
q(0,'En el VIH integrado al genoma, la RNA polimerasa II de la célula normalmente…','Termina la transcripción tras unos cientos de nucleótidos, sin transcribir el genoma viral completo',['Transcribe de forma eficiente todo el genoma viral','Nunca se une al ADN viral','Edita el RNA viral de A a I antes de transcribirlo'],'Este es el ejemplo clásico de atenuación: la Pol II termina prematuramente y el virus necesita a Tat para evitarlo.');
q(0,'¿Qué hace la proteína Tat del VIH?','Se une al RNA naciente y ensambla proteínas del hospedero para impedir la terminación prematura',['Dirige a los RNA virales sin splicing hacia el citosol','Corta el RNA viral en el sitio de poliadenilación','Fosforila a eIF2'],'Tat evita la atenuación; Rev (no Tat) es la que dirige la exportación nuclear de RNAs virales con intrones.');
q(0,'Tat se une a una estructura de tallo-lazo con “base abultada” en el RNA naciente. ¿Cómo se llama esa estructura?','TAR',['RRE','IRES','uORF'],'TAR es el sitio de unión de Tat. RRE (Rev Responsive Element) es el sitio de unión de Rev, e IRES es otra cosa (entrada ribosomal).');
v(0,'El mecanismo de atenuación del VIH es un ejemplo de control en el que un mecanismo normal de la célula es “secuestrado” por el virus.',true,'Algunas de las proteínas que ensambla Tat normalmente previenen la pausa y terminación prematura de la Pol II en genes celulares normales.');
q(0,'Se estima que en humanos, el porcentaje de genes que producen múltiples proteínas por splicing alternativo es aproximadamente…','90%',['10%','25%','Menos del 1%'],'Alberts estima ~90% de los genes humanos con splicing alternativo.');
q(0,'El gen Dscam de Drosophila puede generar cuántas variantes por splicing alternativo, aproximadamente?','38,016',['12','1,000','Solo 2'],'Dscam tiene arreglos de exones alternativos (A: 12, B: 48, C: 33, D: 2). Un solo gen podría dar más proteínas que genes tiene todo el genoma de la mosca (~14,000).');
q(0,'¿Qué enseña el ejemplo de Dscam y de la levadura sobre la complejidad de un organismo?','El número de genes no equivale a complejidad: el splicing alternativo amplía mucho el número de proteínas',['Que a mayor número de genes siempre hay mayor complejidad','Que la levadura tiene más splicing alternativo que la mosca','Que el splicing alternativo solo existe en bacterias'],'La levadura (~6,200 genes, solo ~300 con intrón, casi todos con uno solo) casi no hace splicing alternativo; en moscas es muy común.');
q(0,'En la regulación NEGATIVA del splicing alternativo…','Una molécula reguladora impide que el spliceosoma acceda a un sitio de splicing',['Una molécula ayuda al spliceosoma a encontrar un sitio ignorado','Se elimina el spliceosoma completo','Se agrega un cap 5′ extra'],'En la regulación negativa un represor se une al pre-mRNA y bloquea el sitio; con frecuencia se usa un sitio secundario y cambia el patrón.');
q(0,'En la regulación POSITIVA del splicing…','Un activador ayuda a dirigir al spliceosoma a un sitio de splicing que habría sido ignorado',['Un represor bloquea el sitio 5′','El intrón se retiene siempre','La RNA polimerasa corta el intrón'],'Los sitios de unión de estos activadores pueden estar lejos de la unión exón-intrón y se llaman “splicing enhancers”, por analogía con los enhancers transcripcionales.');
q(0,'¿Qué son los “splicing enhancers”?','Secuencias de RNA a las que se unen activadores que ayudan al spliceosoma a usar un sitio de splicing',['Secuencias de ADN que promueven la transcripción','Enzimas que cortan el poli-A','Proteínas que degradan intrones'],'Se llaman así por analogía con los enhancers transcripcionales.');
q(0,'La transposasa del elemento P de Drosophila es funcional en células germinales pero no en somáticas porque…','En las somáticas se conserva un intrón en el RNA de la transposasa que solo se elimina en las germinales',['El gen está delecionado en las células somáticas','Las células somáticas no tienen RNA polimerasa','En las germinales se edita de A a I'],'Es un ejemplo de splicing alternativo regulado para activar o inactivar una proteína según el tipo celular.');
q(0,'La tropomiosina es un ejemplo de proteína en la que el splicing alternativo…','Genera versiones especializadas según el tipo celular',['Elimina completamente su función','Solo ocurre en células germinales','Cambia el sitio de poliadenilación sin afectar el splicing'],'El splicing regulado produce formas de proteínas específicas de tipo celular, según lo que necesita cada célula.');
q(0,'“Ambigüedad de secuencia de intrón” significa que…','El spliceosoma no distingue claramente entre dos o más pares de sitios 5′ y 3′ y elige distintos al azar en cada transcrito',['El intrón no tiene secuencia','Los intrones se transcriben a proteínas','El exón se confunde con el promotor'],'Esto produce splicing alternativo constitutivo: se generan varias versiones de la proteína en todas las células que expresan el gen.');
q(0,'Tras descubrir el splicing alternativo, la definición de gen se modificó a…','Una secuencia de ADN transcrita como una unidad que codifica un conjunto de polipéptidos estrechamente relacionados (isoformas)',['Un fragmento de ADN que codifica exactamente un polipéptido','Solo la región promotora','Cualquier secuencia con intrones'],'La hipótesis “un gen = un polipéptido” (trabajos con Neurospora, años 40) tuvo que ampliarse a “un gen = un conjunto de isoformas relacionadas”.');
q(0,'La hipótesis “un gen = una enzima/polipéptido” surgió de trabajos con el hongo…','Neurospora',['Saccharomyces','Arabidopsis','Escherichia coli'],'La bioquímica genética de Neurospora en los años 40 llevó a esa hipótesis.');
q(0,'Un cambio en el sitio de corte del transcrito y de poliadenilación afecta principalmente…','El extremo C-terminal de la proteína resultante',['El extremo N-terminal','El promotor del gen','La secuencia del tRNA de inicio'],'Cambiar dónde termina el mRNA modifica el C-terminal. Una variante puede ser solo la versión truncada de la otra.');
v(0,'Hasta ~50% de los genes humanos codificantes producen mRNAs que difieren en su sitio de poliadenilación.',true,'El análisis de RNAs de distintos tipos celulares indica que hasta el 50% de los genes humanos tienen variación en el sitio de poliadenilación.');
q(0,'En un B-linfocito no estimulado, el anticuerpo producido es…','Anclado a la membrana, y sirve como receptor de antígeno',['Secretado al plasma','Degradado en P-bodies','Una proteína sin región C-terminal'],'Tras la estimulación con antígeno, el linfocito prolifera y cambia a secretar el anticuerpo.');
q(0,'¿Qué diferencia hay entre el anticuerpo anclado a membrana y el secretado?','El anclado tiene una cadena larga de aminoácidos hidrofóbicos en el C-terminal; el secretado una cadena corta hidrofílica',['El secretado tiene aminoácidos hidrofóbicos y el anclado hidrofílicos','Son idénticos en todo el C-terminal','Provienen de genes distintos'],'Son iguales salvo en el extremo C-terminal. Los residuos hidrofóbicos atraviesan la bicapa lipídica.');
q(0,'¿Qué provoca el cambio de anticuerpo anclado a secretado en el B-linfocito activado?','Aumento de la concentración de CstF, que favorece cortar y poliadenilar en un sitio subóptimo anterior',['Mutación del gen del anticuerpo','Fosforilación de eIF2','Edición C→U'],'CstF es un factor general de procesamiento; al subir su concentración, se usa el sitio de corte más cercano y se produce el transcrito corto.');
q(0,'Los DOS principales tipos de edición de mRNA en animales son…','A→I (desaminación de adenina a inosina) y C→U (desaminación de citosina a uracilo)',['G→A y U→C','A→U y G→C','Metilación y acetilación'],'Ambas son desaminaciones. A→I es la más frecuente; C→U es menos frecuente.');
q(0,'La inosina (producto de la edición A→I) se aparea con…','Citosina',['Adenina','Uracilo','Guanina'],'La inosina se lee como guanina, por lo que se aparea con citosina. Esto cambia el significado del RNA.');
q(0,'La edición A→I está a cargo de las enzimas…','ADAR (adenosina desaminasas que actúan sobre RNA)',['Dicer','Argonauta','Nucleasas de restricción'],'ADAR reconoce una estructura de RNA de doble cadena formada por el sitio a editar y una secuencia complementaria (frecuentemente en un intrón).');
q(0,'¿Cómo “sabe” ADAR dónde editar?','Reconoce una estructura de doble cadena del propio RNA entre el sitio a editar y una secuencia complementaria',['Reconoce el cap 5′','Reconoce el codón AUG','Se une al poli-A'],'La estructura de doble cadena especifica si se edita y en qué posición.');
q(0,'La edición A→I del mRNA de un canal iónico del cerebro cambia…','Una glutamina por una arginina, alterando la permeabilidad al Ca²⁺',['Una arginina por un codón stop','Un codón start por uno stop','La permeabilidad al Na⁺ sin cambiar aminoácidos'],'Los ratones que no pueden hacer esta edición tienen convulsiones epilépticas y mueren poco después del destete.');
q(0,'Si una edición ocurre DENTRO de la región codificante, puede…','Cambiar la secuencia de aminoácidos o generar un codón stop prematuro y una proteína truncada',['Solo afectar el cap 5′','No tener ningún efecto posible','Cambiar el número de cromosomas'],'En regiones no codificantes puede afectar splicing, transporte nuclear, eficiencia de traducción o apareamiento con miRNAs.');
q(0,'Si la edición ocurre FUERA de la región codificante, puede afectar…','El patrón de splicing, el transporte al citosol, la eficiencia de traducción y el apareamiento con miRNAs',['Solamente la secuencia de aminoácidos','Nada, porque esas zonas no se usan','Únicamente la replicación del ADN'],'Las regiones no codificantes del mRNA llevan información reguladora.');
q(0,'La apolipoproteína B en células del intestino…','Sufre edición C→U que crea un codón stop prematuro y produce una proteína truncada',['Es más larga que en el hígado','Sufre edición A→I que crea un codón start','Es idéntica a la del hígado'],'En el hígado no se expresa la enzima de edición y se produce la apoB larga. Ambas isoformas participan en el metabolismo de lípidos.');
q(0,'¿Qué codón cambia en la edición de la apolipoproteína B?','CAA → UAA (codón stop)',['AUG → GUG','UAA → CAA','GGA → GGG'],'La C se desamina a U convirtiendo CAA (glutamina) en UAA (stop).');
q(0,'Una hipótesis sobre el origen evolutivo de la edición del RNA es que…','Surgió como defensa contra retrovirus y retrotransposones',['Surgió para reemplazar la replicación','Surgió para crear intrones','Surgió solo en bacterias'],'Algunos retrovirus, incluido el VIH, son editados extensamente (hiperedición): se generan mutaciones dañinas y los mRNAs virales se retienen en el núcleo.');
q(0,'Aproximadamente qué fracción de la masa de RNA sintetizado en mamíferos sale del núcleo?','Alrededor de 1/20',['Casi la totalidad','La mitad','Ninguna'],'La mayoría del RNA se degrada en el núcleo (intrones excisados, fragmentos 3′ al sitio de poli-A, RNAs mal procesados).');
q(0,'¿Qué pasa normalmente con el pre-mRNA que aún no se procesó completamente?','No se exporta del núcleo hasta completar su procesamiento',['Sale inmediatamente al citosol','Se traduce dentro del núcleo','Se convierte en tRNA'],'La exportación del RNA se retrasa hasta terminar el procesamiento. Algunos virus evaden este control.');
q(0,'La proteína Rev del VIH se une a…','El elemento RRE dentro de un intrón viral, e interactúa con el receptor de exportación Crm1',['El elemento TAR en el RNA naciente','El cap 5′ del mRNA celular','El poli-A del mRNA viral'],'Gracias a Rev, los RNAs virales con intrones salen del núcleo por los poros nucleares.');
q(0,'¿Para qué necesita el VIH exportar RNAs sin splicing al citosol?','Para empacarlos en cápsides como genoma viral y traducir proteínas',['Para degradarlos en P-bodies','Para editarlos de A a I','Para convertirlos en miRNAs'],'Los transcritos completos sin splicing sirven como genoma viral y las versiones alternativas con intrones codifican proteínas que el virus necesita en el citoplasma.');
q(0,'Rev divide la infección por VIH en…','Una fase temprana (solo RNAs con splicing completo se exportan, entre ellos el de Rev) y una tardía (se exportan RNAs sin splicing)',['Una fase lítica y una lisogénica','Una fase de transcripción y una de replicación del ADN','Una fase de edición y una de metilación'],'Esto ayuda a que el virus genere los productos en el orden en que se necesitan.');
q(0,'La latencia del VIH (genoma integrado pero sin producir proteínas virales) se logra gracias a la regulación mediante…','Rev y Tat',['Dicer y Drosha','ADAR y apoB','CstF y eIF2'],'Si las condiciones son desfavorables, Rev y Tat se producen a niveles muy bajos y el ciclo viral se detiene hasta que mejoran.');

/* ===== TEMA 1: 2.5 Traducción y estabilidad del mRNA ===== */
q(1,'Cuando el mRNA sale del núcleo, lleva marcas de que se completó el procesamiento. ¿Cuáles?','Cap 5′, poli-A 3′ y proteínas ancladas como los complejos de unión exón-exón (EJC)',['Solo el poli-A','Solo los intrones','Un segmento de ADN unido'],'Estas marcas y proteínas señalan el éxito de los pasos del procesamiento.');
q(1,'¿Qué región del mRNA actúa como “código postal” que dirige al mRNA a distintos puntos de la célula?','UTR 3′',['UTR 5′','El codón de inicio AUG','El cap 5′'],'Las señales para localización suelen estar en el 3′ UTR.');
q(1,'¿Cuál NO es uno de los mecanismos de localización de mRNAs?','Replicación del mRNA en el sitio de destino',['Transporte dirigido por motores del citoesqueleto','Difusión aleatoria y atrapamiento por proteínas ancla','Degradación generalizada con protección local'],'Los tres mecanismos son transporte con motores (usan ATP), difusión y atrapamiento, y degradación general con protección local por proteínas.');
q(1,'¿Para qué sirve localizar el mRNA en regiones específicas del citosol?','Concentrar la producción de la proteína donde se necesita y generar asimetrías (importante en neuronas)',['Para aumentar el número de intrones','Para evitar la traducción siempre','Para hacer splicing'],'La localización junto con control de la traducción permite regular la expresión de forma independiente en distintas regiones.');
q(1,'El mRNA de Bicoid en el huevo de Drosophila se localiza en…','El extremo anterior del huevo, y al traducirse forma un gradiente de proteína',['El extremo posterior','El núcleo','La mitocondria'],'Bicoid es un regulador transcripcional crucial para el desarrollo de la parte anterior del embrión.');
q(1,'El mRNA de la actina en fibroblastos de mamíferos se localiza en…','El córtex celular rico en filamentos de actina, mediante una señal en el 3′ UTR',['El nucléolo','El aparato de Golgi','La membrana nuclear'],'Es un ejemplo de mRNA localizado en células somáticas.');
q(1,'En el experimento con el mRNA de hairy (Drosophila), el transcrito sin 3′ UTR…','No se localizó en el lado apical de los núcleos',['Se localizó mejor','Se localizó igual que el completo','Se degradó en el núcleo'],'Demuestra que el 3′ UTR es necesario para la localización del mRNA.');
q(1,'¿Qué dirige a una proteína secretada hacia el retículo endoplásmico?','Una secuencia señal en su extremo N-terminal',['El poli-A del mRNA','El cap 5′','Un intrón'],'Los componentes de clasificación reconocen la secuencia señal cuando emerge del ribosoma y llevan todo el complejo a la membrana del RE.');
q(1,'¿Cuál es la forma MÁS COMÚN de regular la cantidad de proteína sintetizada a partir de un mRNA?','Controlar el inicio de la traducción',['Controlar la terminación de la traducción','Modificar el codón stop','Aumentar el número de ribosomas'],'Aunque los detalles difieren entre procariotas y eucariotas, ambos usan estrategias reguladoras similares.');
q(1,'En bacterias, la secuencia conservada justo antes del AUG de inicio se llama…','Shine-Dalgarno',['TATA box','Kozak','TAR'],'La regulación traduccional bacteriana suele exponer o bloquear la secuencia Shine-Dalgarno.');
q(1,'En eucariotas, la selección del AUG de inicio depende sobre todo de…','Su cercanía al cap 5′ y de la secuencia circundante',['Una secuencia Shine-Dalgarno','El tamaño del poli-A','La presencia de intrones'],'La subunidad pequeña del ribosoma se une al cap 5′ y escanea hasta el primer AUG en un buen contexto.');
q(1,'Las proteínas represoras de la traducción en eucariotas pueden…','Anclarse en el extremo 5′ del mRNA, o interferir con la comunicación entre cap 5′ y poli-A 3′',['Cortar el poli-A','Añadir intrones','Sintetizar ribosomas'],'La interacción cap 5′–poli-A 3′ es requisito para la traducción eficiente.');
q(1,'¿Cuál es la función normal de eIF2?','Formar un complejo con GTP y mediar la unión del tRNA iniciador (Met) a la subunidad ribosomal pequeña',['Unir la subunidad ribosomal grande','Degradar el poli-A','Cortar el mRNA'],'Cuando se reconoce el AUG, eIF2 hidroliza el GTP a GDP y se libera; entonces se une la subunidad grande y empieza la síntesis.');
q(1,'¿Qué ocurre cuando se reconoce el AUG durante el escaneo?','eIF2 hidroliza GTP a GDP, se libera de la subunidad pequeña y se une la subunidad grande',['eIF2 se une al poli-A','Se corta el cap 5′','Se fosforila el AUG'],'Se forma el ribosoma completo y comienza la síntesis proteica.');
q(1,'eIF2 se une muy fuerte a GDP. ¿Qué necesita para ser reutilizada?','eIF2B, un factor de intercambio de nucleótidos de guanina (GEF) que libera el GDP',['eIF4E','Dicer','Una ligasa'],'Sin eIF2B no puede cambiar GDP por un nuevo GTP.');
q(1,'¿Por qué la fosforilación de eIF2 frena la síntesis proteica?','Porque el eIF2 fosforilado se une muy fuerte a eIF2B y lo inactiva',['Porque degrada al ribosoma','Porque corta el tRNA iniciador','Porque inhibe a la RNA polimerasa'],'Hay más eIF2 que eIF2B en la célula, así que incluso una fracción pequeña de eIF2 fosforilado atrapa casi todo eIF2B y bloquea la reutilización del eIF2 no fosforilado.');
q(1,'¿Cuál NO es una condición que reduce globalmente la síntesis de proteínas vía fosforilación de eIF2?','Exceso de nutrientes y factores de crecimiento',['Privación de factores de crecimiento o nutrientes','Infección viral','Aumentos repentinos de temperatura'],'La fosforilación de eIF2 es un mecanismo de adaptación celular ante la falta de nutrientes y otros estresores.');
q(1,'En células de mamífero en G0 (reposo), la síntesis total de proteínas es aproximadamente…','Una quinta parte de la de células en proliferación',['El doble','Igual','Cero'],'La regulación del nivel de eIF2 activo es importante para entrar en este estado no proliferativo.');
q(1,'El “leaky scanning” ocurre cuando…','Los nucleótidos alrededor del primer AUG son un contexto pobre y el ribosoma lo ignora y usa el segundo o tercer AUG',['El ribosoma pierde el cap 5′','El mRNA se fuga del núcleo','El ribosoma lee el mRNA al revés'],'Se producen proteínas muy similares pero con distinto N-terminal.');
q(1,'¿Qué consecuencia biológica puede tener el leaky scanning?','Una misma proteína con y sin secuencia señal N-terminal, dirigida a distintos sitios (ej. mitocondria y citosol)',['Proteínas con distinto C-terminal','Mutaciones en el ADN','Mayor número de intrones'],'La variación en el N-terminal cambia la señal de localización de la proteína.');
q(1,'Un uORF es…','Un marco de lectura abierto corto, río arriba del gen, entre el extremo 5′ y la secuencia codificante verdadera',['Un exón alternativo','Una secuencia del 3′ UTR','Un tipo de intrón'],'Un ORF va de un ATG a un stop sin stops intermedios; en un uORF la secuencia de aminoácidos que codifica no es relevante, solo su función reguladora.');
q(1,'¿Cómo disminuye un uORF la traducción del gen río abajo?','Atrapa al complejo ribosomal, que traduce el uORF y se disocia del mRNA sin llegar a la secuencia codificante verdadera',['Degrada el mRNA','Bloquea el cap 5′ con proteínas','Inserta intrones'],'Es un mecanismo regulador de la traducción.');
q(1,'El mRNA de Gcn4 en levadura contiene varios uORFs. En abundancia de aminoácidos…','Los ribosomas traducen los uORFs y se disocian antes de llegar a Gcn4',['Se traduce mucho Gcn4','Se edita el mRNA','Se fosforila Gcn4'],'Con poca disponibilidad de aminoácidos, eIF2 baja y el ribosoma pasa de largo los uORFs, llega al Gcn4 e inicia la traducción.');
q(1,'¿Por qué la fosforilación de eIF2 puede AUMENTAR la traducción de algunos mRNAs?','Porque ribosomas con poco eIF2 saltan los uORFs y llegan a la secuencia codificante (ej. Gcn4)',['Porque activa la RNA polimerasa','Porque aumenta eIF2B','Porque elimina el cap 5′'],'Así la célula en inanición apaga casi toda la síntesis, pero produce las enzimas de biosíntesis de los aminoácidos que le faltan.');
q(1,'¿Qué es un IRES?','Un sitio interno de entrada ribosomal, una estructura de RNA plegada que permite iniciar la traducción lejos del extremo 5′',['Un tipo de intrón','Una secuencia de poliadenilación','Una secuencia del promotor'],'IRES = Internal Ribosome Entry Site.');
q(1,'Aproximadamente qué porcentaje de los mRNAs eucariotas inicia traducción en el primer AUG río abajo del cap 5′?','~90%',['~10%','~50%','~1%'],'El resto se saltan el primer AUG o usan mecanismos alternos como IRES.');
q(1,'En un mRNA con dos secuencias codificantes en tándem…','La primera se traduce por el método normal (cap-dependiente) y la segunda por IRES',['Ambas por IRES','Ninguna se traduce','La segunda por scanning y la primera por IRES'],'Esto permite iniciar la traducción de la segunda secuencia lejos del cap 5′.');
q(1,'Los IRES…','No requieren la estructura del cap 5′ ni eIF4E, y diferentes IRES requieren distintos subconjuntos de factores de iniciación',['Siempre requieren eIF4E','Solo se encuentran en bacterias','Requieren Shine-Dalgarno'],'Se pliegan en estructuras que unen muchos (no todos) los mismos factores del inicio normal cap-dependiente.');
q(1,'Algunos virus bloquean la traducción de mRNAs del hospedero y favorecen la suya produciendo una proteasa que…','Corta eIF4G, impidiendo que se una a eIF4E (cap)',['Corta el poli-A','Degrada el ribosoma','Fosforila eIF2B'],'El eIF4G truncado sigue siendo competente para iniciar traducción en sitios internos (IRES) del mRNA viral.');
q(1,'¿Cuál es la vida media aproximada de un mRNA bacteriano típico?','Menos de un par de minutos',['~30 minutos','~10 horas','Días'],'Por eso la bacteria se adapta rápido a cambios ambientales. Las exonucleasas que degradan 3′→5′ suelen ser las responsables.');
q(1,'La vida media típica de un mRNA eucariota es…','Menos de 30 minutos en la mayoría, aunque algunos, como β-globina, duran más de 10 horas',['Siempre menor a 2 minutos','Siempre más de 10 horas','Igual a la de bacterias'],'Los mRNAs de factores de crecimiento y reguladores de transcripción tienen vidas medias especialmente cortas porque su producción cambia rápido.');
q(1,'Los dos mecanismos generales de destrucción del mRNA eucariota comienzan con…','El acortamiento gradual del poli-A por una exonucleasa (desadenilación)',['La remoción del intrón','La fosforilación del cap','El corte del codón stop'],'El poli-A funciona como una cuenta regresiva (timer) de la vida del mRNA.');
q(1,'¿Cuál es la longitud crítica de poli-A (en humanos) en la que se bifurcan las vías de degradación?','~25 nucleótidos',['~200 nucleótidos','~5 nucleótidos','~1,000 nucleótidos'],'Al llegar a ~25 A se define si ocurre decapping (5′→3′) o continúa la degradación 3′→5′.');
q(1,'Mecanismo 1 de degradación de mRNA:','Remoción del cap 5′ (decapping) y degradación rápida 5′→3′',['Degradación 3′→5′ desde el poli-A','Corte del intrón','Edición A→I'],'El mRNA “expuesto” sin cap se degrada desde el extremo 5′.');
q(1,'Mecanismo 2 de degradación de mRNA:','Degradación continua 3′→5′ desde el poli-A hacia la secuencia codificante',['Decapping y degradación 5′→3′','Splicing alternativo','Edición C→U'],'Casi todos los mRNAs están sujetos a ambos tipos de decaimiento.');
q(1,'¿Qué región del mRNA tiene sitios de unión para proteínas que aceleran o frenan el acortamiento del poli-A y el decapping?','UTR 3′',['UTR 5′','El codón stop','El intrón'],'El 3′ UTR es especialmente importante para controlar la vida del mRNA.');
q(1,'La traducción y la degradación del mRNA…','Compiten: factores que aumentan la eficiencia de traducción tienden a reducir la degradación',['Son procesos que se favorecen siempre','No tienen relación','Ocurren en el núcleo'],'El acortamiento del poli-A y el decapping compiten con la maquinaria de traducción, que se asocia con cap y poli-A.');
q(1,'Algunos mRNAs son degradados por un mecanismo que evita la desadenilación. ¿Cuál es?','Corte interno por endonucleasas que deja ambos extremos expuestos',['Edición A→I','Splicing','Metilación del ADN'],'Cortan el mRNA internamente, dejando un extremo sin cap y otro sin poli-A, y ambos mitades se degradan rápido.');
q(1,'Ejemplo del hierro: en deficiencia de hierro, la aconitasa (proteína de respuesta a hierro) se une al 5′ UTR del mRNA de ferritina y…','Bloquea su traducción (no se hace ferritina)',['Aumenta su traducción','Corta el mRNA','Lo exporta del núcleo'],'En escasez de hierro no tiene sentido fabricar ferritina (que almacena hierro).');
q(1,'En deficiencia de hierro, la aconitasa se une al 3′ UTR del mRNA del receptor de transferrina y…','Bloquea un sitio de corte de endonucleasas, estabilizando el mRNA (se produce receptor)',['Lo degrada','Bloquea su traducción','Lo edita'],'Así la célula importa más hierro.');
q(1,'Con exceso de hierro en el citosol…','La aconitasa se libera del mRNA: se traduce ferritina y se degrada el mRNA del receptor de transferrina',['Se produce más receptor de transferrina','No se produce ferritina','La aconitasa se une más a los mRNAs'],'Al unir hierro, la aconitasa se disocia; se expone el sitio de corte del mRNA del receptor y se destruye, y la ferritina sí se traduce.');
q(1,'¿Qué son los P-bodies (cuerpos de procesamiento)?','Agregados citosólicos sin membrana donde ocurren decapping y degradación del mRNA',['Organelos con membrana donde se sintetiza el poli-A','Un tipo de ribosoma','Estructuras nucleares para el splicing'],'Son “organelos” sin membrana formados por agregados de proteínas y ácidos nucleicos con conexiones laxas.');
q(1,'¿Qué son los gránulos de estrés (stress granules)?','Agregados que almacenan mRNAs con factores de iniciación, poli-A binding protein y subunidades pequeñas; ahí no hay traducción pero los mRNAs quedan “listos”',['Sitios de traducción activa','Lugares donde se degrada todo el mRNA','Vesículas de secreción'],'Los mRNAs pueden pasar de P-bodies a gránulos de estrés y volver luego a traducirse.');
q(1,'Un mRNA liberado del núcleo puede seguir uno de estos destinos…','Traducirse, almacenarse en gránulos de estrés, o degradarse en P-bodies',['Solo traducirse','Solo degradarse','Regresar al núcleo para ser editado'],'Pueden moverse entre estas reservas según las necesidades de la célula (ciclo del mRNA).');
q(1,'Cuando la iniciación de la traducción está bloqueada (por inanición, fármacos o manipulación genética), los gránulos de estrés…','Aumentan de tamaño al recibir más mRNAs no traducidos',['Desaparecen','Se convierten en núcleo','Degradan todo el RNA'],'Se mueven más mRNAs directamente a gránulos de estrés para almacenarse.');
v(1,'El mRNA que “pasa” la primera ronda de traducción (prueba de decaimiento mediado por sentido erróneo/nonsense) generalmente se traduce de forma eficiente.',true,'Después de la primera ronda de traducción que pasa el control de calidad (NMD), el mRNA se traduce “en serio”.');

/* ===== TEMA 2: RNAi y RNA no codificante ===== */
q(2,'¿Qué es la interferencia por RNA (RNAi)?','Un mecanismo en el que RNAs cortos de cadena sencilla (20 a 30 nt) guían la regulación de otros RNAs por apareamiento de bases',['La edición A→I del mRNA','El empalme de intrones','La replicación del RNA viral'],'Los RNAs pequeños localizan sus dianas por complementariedad de bases y generalmente reducen la expresión génica.');
q(2,'Los TRES tipos de RNAi son…','miRNAs, siRNAs y piRNAs',['tRNAs, rRNAs y mRNAs','snRNAs, snoRNAs y Xist','ADAR, Dicer y Drosha'],'microRNAs, RNAs cortos de interferencia (siRNA) y RNAs que interactúan con Piwi (piRNA).');
q(2,'Cuando el blanco de un RNAi es un mRNA maduro, el RNAi puede…','Inhibir su traducción o catalizar su destrucción',['Aumentar su traducción','Editarlo','Exportarlo al núcleo'],'Si el blanco es un RNA en transcripción, puede unirse a él y dirigir la formación de cromatina represora (heterocromatina) en el ADN molde.');
q(2,'Si el RNA blanco aún está siendo transcrito, el RNAi puede…','Dirigir la formación de heterocromatina (cromatina represora) sobre el ADN del que se transcribe',['Aumentar la transcripción','Añadir cap 5′','Cortar los intrones'],'Es una de las tres consecuencias posibles: corte del RNA blanco, represión traduccional con destrucción eventual, o heterocromatina.');
q(2,'Los microRNAs (miRNAs) regulan aproximadamente…','Un tercio de los genes codificantes de proteínas humanas',['Menos del 1%','Todos los genes','Solo los genes mitocondriales'],'En el genoma humano se producen más de 1000 miRNAs.');
q(2,'Los precursores de los miRNAs se sintetizan por…','RNA polimerasa II, y están capados y poliadenilados',['RNA polimerasa III sin cap','ADN polimerasa','Dicer'],'Luego sufren un procesamiento especial para formar el miRNA maduro (~23 nt).');
q(2,'El orden de procesamiento del miRNA es…','Cropping (Drosha, en el núcleo) → exportación → dicing (Dicer, en el citosol) → ensamblaje en RISC',['Dicing → cropping → splicing','Splicing → capping → dicing','Edición → cropping → traducción'],'Drosha corta (“cropping”) en el núcleo; Dicer corta (“dicing”) en el citosol.');
q(2,'RISC significa…','RNA-Induced Silencing Complex',['RNA-Initiated Splicing Complex','Ribosome Initiation Start Codon','RNA-Intron Spliced Complex'],'Contiene Argonauta, Drosha y Dicer entre las proteínas principales (según la presentación) y guía la búsqueda del blanco.');
q(2,'¿Cuál es la función de la proteína Argonauta?','Sostener el extremo 5′ del miRNA para facilitar el apareamiento con el RNA blanco y, si el apareamiento es extenso, cortarlo (slicing)',['Añadir el cap 5′','Convertir ADP en ATP','Sintetizar el poli-A'],'Es componente de RISC; su sitio activo contiene 2 átomos de Mg²⁺ necesarios para cortar.');
q(2,'La enzima Dicer…','Corta RNAs de doble cadena en fragmentos pequeños (~23 pb), como los siRNAs, y procesa los miRNAs',['Une exones','Añade poli-A','Hidroliza GTP en eIF2'],'Dicer procesa tanto miRNAs como siRNAs.');
q(2,'En animales, el miRNA normalmente se une al mRNA…','Con un apareamiento corto (≥7 nt, región “semilla”) principalmente en el 3′ UTR',['Con complementariedad total en el cap 5′','En el codón AUG exclusivamente','En el ADN'],'Este apareamiento parcial conlleva represión traduccional y mRNA enviado a P-bodies.');
q(2,'Cuando el apareamiento miRNA–mRNA es EXTENSO (común en plantas), el resultado es…','Corte (slicing) del mRNA por Argonauta y su rápida degradación',['Edición del mRNA','Solo represión traduccional','Exportación del mRNA'],'El RISC se libera y puede buscar más mRNAs, actuando catalíticamente.');
q(2,'Cuando el apareamiento es poco extenso (como en la mayoría de los miRNAs humanos)…','Se reprime la traducción y el mRNA se envía a P-bodies (se acorta el poli-A, decapping y degradación)',['Se corta inmediatamente por Argonauta','Se edita el mRNA','Se duplica el mRNA'],'Argonauta no corta; el mRNA queda secuestrado de los ribosomas y finalmente se degrada.');
q(2,'Una ventaja de los miRNAs como reguladores es que…','Un solo miRNA puede regular cientos de mRNAs, y varios miRNAs pueden actuar combinatoriamente sobre un mismo mRNA',['Solo regulan un gen cada uno','Necesitan un gen enorme','No dependen de la complementariedad'],'Además ocupan poco espacio en el genoma comparados con una proteína.');
q(2,'Los siRNAs se generan a partir de…','RNA de doble cadena (por ejemplo, de virus o transposones) procesado por Dicer',['ADN de doble cadena','Proteínas','Exones'],'Cada vez que RISC corta un RNA nuevo se libera y puede cortar muchos más.');
q(2,'RNAi como mecanismo de defensa celular:','Degrada RNA foráneo de doble cadena (virus, transposones) usando proteínas que también participan en la regulación por miRNAs',['Elimina solo el RNA propio','No tiene función defensiva','Sólo existe en bacterias'],'Su parecido con el sistema inmune: una respuesta personalizada que se amplifica y protege a todo el organismo.');
q(2,'En algunos organismos, la respuesta de RNAi se amplifica porque…','RNA polimerasas dependientes de RNA usan siRNAs como cebadores para producir más RNA de doble cadena',['Los siRNAs se replican por ADN polimerasa','Se produce más Dicer sin siRNA','El ribosoma los copia'],'Así la interferencia continúa aunque se haya degradado el RNA inicial, e incluso pasa a células hijas.');
q(2,'En plantas, el RNAi puede transmitirse entre células mediante…','Fragmentos de RNA que pasan por canales conectores finos (plasmodesmos), dando resistencia sistémica a virus de RNA',['Mitosis','Esporas','Proteínas de secreción'],'Basta que unas pocas células se infecten para que toda la planta se vuelva resistente.');
q(2,'Los piRNAs interactúan con proteínas de la familia…','Piwi',['Rev','Tat','eIF4'],'Piwi, junto con Argonauta, es una familia de proteínas que se une a RNAs interferentes.');
v(2,'Tres de las cuatro proteínas Argonauta humanas carecen de sitio catalítico y por tanto unen RNAs blanco sin cortarlos.',true,'Solo algunas Argonautas cortan; las demás reprimen la traducción sin slicing.');
q(2,'¿Cuál de estas moléculas es un ejemplo de RNA no codificante con función en inactivar un cromosoma X?','Xist',['miRNA-21','Tat','TAR'],'Xist inactiva una copia del cromosoma X en hembras de mamíferos.');
/* ===== TEMA 3: 3.2 Electroforesis e hibridación ===== */
q(3,'¿Cuál es el principio de la electroforesis en gel?','Separar moléculas por tamaño al hacerlas migrar a través de una matriz de gel con corriente eléctrica',['Separarlas por color','Separarlas por punto de ebullición','Separarlas por su secuencia'],'El gel funciona como obstáculo inerte: los fragmentos pequeños avanzan más lejos y más rápido.');
q(3,'El ADN en electroforesis se desplaza hacia…','El polo positivo (ánodo), porque tiene carga negativa',['El polo negativo','Se queda en el pozo','Hacia el centro del gel'],'Los grupos fosfato le dan carga negativa neta al ADN.');
q(3,'En un gel, los fragmentos MÁS PEQUEÑOS…','Se desplazan más lejos y más rápido',['Se quedan cerca del pozo','Se desplazan más lento','No entran al gel'],'El desplazamiento es inversamente proporcional al tamaño.');
q(3,'¿Cómo se visualiza el ADN tras la corrida?','Con colorantes fluorescentes, como el bromuro de etidio, que se intercalan entre las bases',['Con luz visible sin tinción','Con antibióticos','Con ADN polimerasa'],'El colorante intercalado permite ver bandas con la longitud de cada fragmento.');
q(3,'Poliacrilamida como matriz de gel:','Alta resolución (diferencia desde 1 pb), pero solo separa fragmentos menores a ~1000 pb',['Separa fragmentos de miles de kb','Baja resolución','No se usa para ADN'],'La poliacrilamida es útil para fragmentos pequeños; la agarosa, para fragmentos grandes.');
q(3,'Agarosa como matriz de gel:','Menor resolución que la poliacrilamida, pero separa cadenas de miles de pb (kb)',['Mayor resolución que poliacrilamida','Solo separa ≤1000 pb','Solo se usa para RNA'],'Por eso se usa agarosa para fragmentos largos.');
q(3,'¿Para qué sirve la electroforesis en campo pulsante?','Separar fragmentos grandes (30–50 kb) que de otro modo “hacen trampa” y migran como línea casi recta',['Separar proteínas','Secuenciar ADN','Teñir el ADN'],'Se usan pulsos eléctricos desde distintos puntos del gel para evitar ese comportamiento.');
q(3,'¿Qué migra más rápido en un gel?','ADN superenrollado, incluso con más pb que el circular relajado',['ADN circular relajado','ADN lineal más largo','Todos migran igual'],'La estructura de la cadena también afecta el paso por la matriz: el ADN circular relajado tarda más que uno lineal de igual longitud.');
q(3,'En la electroforesis de RNA, ¿cómo se evita el error causado por estructuras secundarias?','Usando reactivos que impiden la formación de pares de bases',['Aumentando la temperatura del gel a 100 °C','Agregando ADN','Usando solo agarosa'],'Así el RNA migra proporcionalmente a su peso molecular.');
q(3,'Las enzimas de restricción reconocen…','Secuencias cortas y palindrómicas y cortan en un sitio definido dentro de ellas',['Secuencias largas y aleatorias','Solo el cap 5′','Cualquier secuencia de ADN'],'Se usan para fragmentar cromosomas grandes (pueden tener cientos de genes y más de 100 Mb).');
q(3,'EcoRI reconoce GAATTC y corta…','5′–G|AATTC–3′',['5′–GAATT|C–3′','Antes de G','Después de la C del extremo 3′'],'El corte genera extremos cohesivos (sesgados).');
q(3,'Un ADN lineal con 6 sitios GAATTC, cortado con EcoRI, genera…','7 fragmentos',['6 fragmentos','5 fragmentos','12 fragmentos'],'Para un ADN lineal, n cortes producen n + 1 fragmentos.');
q(3,'¿Qué es la hibridación de ADN?','El emparejamiento de bases entre polinucleótidos de cadena sencilla complementarios',['La unión de proteínas con ADN','La replicación del ADN','La conversión de RNA a ADN'],'Permite detectar secuencias específicas en mezclas complejas.');
q(3,'¿Qué es una sonda (probe)?','Una secuencia marcada (purificada o sintética) que hibridiza con la secuencia complementaria que se busca',['Una enzima de restricción','Un tipo de gel','Un anticuerpo'],'Debe estar marcada para identificarse cuando encuentre su secuencia complementaria.');
q(3,'El Southern blot detecta…','Secuencias específicas de ADN',['RNA','Proteínas','Lípidos'],'Es hibridación de ADN: se fragmenta con enzimas de restricción, se corre electroforesis, se transfiere a membrana y se hibridiza con una sonda.');
q(3,'Orden correcto del Southern blot:','Digestión con enzimas de restricción → electroforesis → desnaturalización (alcalina) → transferencia a membrana → hibridación con sonda → detección',['Hibridación → electroforesis → digestión','Transferencia → digestión → electroforesis','Detección → hibridación → corte'],'Se alcaliniza el gel para desnaturalizar el ADN y se transfiere a nitrocelulosa o nylon.');
q(3,'¿Para qué se alcaliniza el gel en el Southern blot?','Para desnaturalizar el ADN (separar las cadenas)',['Para teñirlo','Para cortarlo','Para marcar la sonda'],'La sonda solo puede hibridar con ADN de cadena sencilla.');
q(3,'El Northern blot es una variante del Southern que analiza…','RNA, para obtener patrones de expresión de genes específicos',['ADN genómico','Proteínas','Cromosomas'],'Se usa un gen clonado como sonda y muestras de RNA de distintos tejidos.');
q(3,'Un Northern blot puede mostrar…','En qué tipos celulares se expresa un gen, abundancia relativa del transcrito (intensidad de banda) y posibles isoformas (transcritos de distinto tamaño)',['La secuencia completa del genoma','Mutaciones puntuales exactas','El número de cromosomas'],'La intensidad de la banda refleja la abundancia relativa del transcrito.');
q(3,'La hibridación in situ se usa para…','Identificar ácidos nucleicos en cromosomas o células sobre láminas de microscopio',['Separar fragmentos de ADN','Clonar genes','Secuenciar'],'En cromosomas se usa para mapeo genético; se utilizan cromosomas en metafase.');
q(3,'FISH significa…','Hibridación in situ con fluorescencia (Fluorescence In Situ Hybridization)',['Fast Isolation of Sequenced Helices','Fragment Identification by Sequence Hybridization','Fluorescent Isotope Sequencing Hybrid'],'Se usa una sonda con fluoróforo; se visualiza, por ejemplo, en cromosomas 46,XX o 46,XY.');
v(3,'Una enzima de restricción que reconoce secuencias de 4 nt corta, en promedio, con más frecuencia que una que reconoce secuencias de 8 nt.',true,'Secuencias más cortas aparecen más seguido: 4 nt aprox. cada 256 nt; 8 nt aprox. cada 65,536 nt.');
v(3,'El RNA migra en electroforesis hacia el polo negativo.',false,'El RNA también tiene carga negativa, por lo que migra hacia el polo positivo.');

/* ===== TEMA 4: 3.3 Secuenciación ===== */
q(4,'La secuenciación consiste en…','Determinar el orden exacto de los nucleótidos en una molécula de ADN o RNA',['Cortar el ADN en fragmentos','Contar el número de genes','Amplificar el ADN'],'El resultado es una secuencia de letras (A, T, C, G) que debe interpretarse.');
q(4,'¿Quién realizó la primera secuenciación de ADN (1975) y en qué organismo?','Frederick Sanger (con Alan Coulson), en el bacteriófago ΦX174',['Maxam y Gilbert, en E. coli','Watson y Crick, en humanos','Illumina, en levadura'],'Su genoma tenía 5,386 nucleótidos; se leían hasta ~80 nt por corrida. Era un método ineficiente.');
q(4,'El método de Sanger (1977) también se conoce como…','Método de terminación de cadena (secuenciación de primera generación)',['Método de degradación química','Secuenciación de nanoporos','Pirosecuenciación'],'Fue el más usado por más de 25 años.');
q(4,'Materiales del método de Sanger:','Plantilla de ADN de una cadena, primer, ADN polimerasa, dNTPs y ddNTPs',['Solo ddNTPs','RNA polimerasa y NTPs','Enzimas de restricción únicamente'],'Los ddNTPs (cuatro tipos distintos) terminan la elongación de la cadena.');
q(4,'¿Por qué los ddNTPs detienen la elongación?','Carecen del grupo 3′-OH y no pueden formar el enlace fosfodiéster con el siguiente nucleótido',['Carecen de la base nitrogenada','Son más grandes','Carecen de fosfato en 5′'],'Suelen estar marcados con fluorescencia o radioactividad.');
q(4,'El método de Maxam-Gilbert (1977) se basa en…','Degradación química del ADN en sitios específicos, con extremos 5′ marcados con ³²P',['Terminación con ddNTPs','Síntesis con fluorescencia','Nanoporos'],'También se llama método de degradación química.');
q(4,'En Maxam-Gilbert, ¿qué compuesto corta específicamente tras modificar el ADN?','Piperidina, que corta el ADN en el sitio modificado',['Hidracina sola','Ácido fórmico únicamente','EcoRI'],'Antes, otros compuestos modifican las bases: dimetil sulfato (G), ácido fórmico (A+G), hidracina (C+T), NaCl + hidracina (solo C).');
q(4,'En Maxam-Gilbert, ¿qué compuesto modifica solo las guaninas?','Dimetil sulfato',['Ácido fórmico','Hidracina','NaCl'],'Ácido fórmico: A+G; hidracina: C+T; NaCl + hidracina: solo C.');
q(4,'El método de Sanger automatizado más común usa…','Electroforesis capilar con ddNTPs marcados con fluorescencia (usado en el Proyecto Genoma Humano)',['Marcaje radioactivo','Hidracina','Nanoporos portátiles'],'La fluorescencia facilita la lectura, reduce costos y automatiza resultados.');
q(4,'Secuenciar el genoma humano en el PGH tardó aproximadamente…','6 a 8 años y costó ~3,000 millones de USD',['1 día y 1,000 USD','3 a 4 meses','24 horas y 3,000 USD'],'Actualmente toma 1 a 3 días y cuesta ~3,000–6,000 USD; la aspiración es 24 hrs y 1,000 USD.');
q(4,'La curva del costo de secuenciar un genoma humano ha disminuido…','Más rápido que la Ley de Moore',['Más lento que la Ley de Moore','Se ha mantenido constante','Ha subido'],'En la Ley de Moore se duplica la potencia; aquí al aumentar la capacidad bajó el costo.');
q(4,'La secuenciación de siguiente generación (NGS) tiene como ventaja…','Facilidad de preparación de muestras, mayor cantidad de resultados, sensibilidad, escalabilidad y velocidad',['Equipo barato','No requiere bioinformática','Lee secuencias de un solo nucleótido a la vez'],'Se ocupa una gran capacidad de procesamiento en paralelo.');
q(4,'Una limitación de NGS es…','Costo del equipo, riesgo de error en regiones homopoliméricas y necesidad de bioinformática compleja',['Que es lenta','Que solo secuencia 80 nt','Que no se puede usar en humanos'],'Los equipos cuestan más de 100,000 USD.');
q(4,'Ejemplos de plataformas NGS:','Illumina (MiSeq), Ion Torrent PGM y Roche 454',['Sanger y Maxam-Gilbert','PCR y qPCR','Southern y Northern'],'MinION de Nanopore es una plataforma portátil de tercera generación.');
q(4,'El MinION (Oxford Nanopore) se caracteriza por…','Ser un secuenciador portátil que lee cientos de kb por corrida y solo requiere una computadora',['Ser un equipo fijo de laboratorio','Leer solo 80 nt','Usar electroforesis en gel'],'No tiene limitación de entorno.');
q(4,'La secuenciación del exoma completo (WES) analiza…','Solo las regiones que codifican proteínas (~1% del genoma)',['El genoma completo','Solo el ADN mitocondrial','Solo intrones'],'Facilita el descubrimiento de mutaciones que provocan enfermedades.');
q(4,'La secuenciación de segmento elegido (targeted sequencing)…','Secuencia regiones específicas de interés (paneles); es más costeable y da mayor cobertura de esas regiones',['Secuencia todo el genoma','No usa paneles','Es más cara que WES siempre'],'Se desarrollan paneles para regiones específicas o zonas conocidas de mutaciones.');
q(4,'¿En qué se aplica la NGS en oncología de precisión?','Analizar el perfil genómico del tumor (mutaciones, alteraciones cromosómicas, fusiones) para tratamiento personalizado',['Para curar sin tratamiento','Solo para diagnósticos prenatales','Solo para identificar bacterias'],'Mejora la eficacia y reduce efectos secundarios.');
q(4,'Una aplicación de NGS en medicina reproductiva es…','Pruebas preimplantacionales para evaluar la salud genética de embriones en FIV',['Detectar PSA','Hacer southern blot','Fabricar insulina'],'También se aplica en diagnóstico genético, enfermedades infecciosas y farmacogenómica.');
q(4,'La farmacogenómica estudia…','Cómo las variantes genéticas del paciente afectan su respuesta a ciertos medicamentos',['La síntesis de fármacos en bacterias','La secuencia de proteínas','La replicación viral'],'Permite medicina personalizada, optimizando eficacia y minimizando efectos secundarios.');
q(4,'En enfermedades infecciosas, la NGS permite…','Identificar rápido patógenos, infecciones polimicrobianas, nuevas cepas virales y resistencia a antibióticos',['Solo detectar virus de ADN','Solo detectar bacterias grandes','Nada de lo anterior'],'Es una de las principales aplicaciones clínicas.');

/* ===== TEMA 5: 3.4 Repetidos, pseudogenes y duplicaciones ===== */
q(5,'El proyecto ENCODE trabaja en…','Identificar elementos funcionales de lo que antes se consideraba ADN basura',['Secuenciar el genoma por primera vez','Clonar genes','Crear organismos transgénicos'],'ENCODE = Encyclopedia of DNA Elements. El PGH determina la secuencia de nucleótidos.');
q(5,'¿Qué porcentaje aproximado del genoma humano son secuencias repetitivas?','~45%',['~5%','~90%','~1%'],'Incluye transposones, pseudogenes, secuencias copiadas dispersas y repeticiones en tándem.');
q(5,'Las duplicaciones segmentales representan aproximadamente…','~5% del genoma (3.5–5%)',['~45%','~20%','~0.1%'],'Son fragmentos largos de ADN replicados (más de 1 kb).');
q(5,'Los repetidos comunes se clasifican según…','Su ubicación, longitud y secuencia',['Su color','El número de genes que contienen','Su sitio de poli-A'],'Hay rangos de repeticiones normales; salirse de ellos conlleva enfermedad.');
q(5,'Una repetición DIRECTA es…','La misma secuencia repetida en el mismo sentido (por ejemplo, TTACG…TTACG)',['Una secuencia seguida de su complemento en reversa','Un solo nucleótido repetido','Una secuencia de RNA'],'En una repetición invertida, la segunda copia es el complemento en reversa (TTACG…CGTAA).');
q(5,'Repetición INVERTIDA de 5′-TTACG-3′:','5′-TTACG…CGTAA-3′',['5′-TTACG…TTACG-3′','5′-TTACG…GCATT-3′','5′-AATGC…TTACG-3′'],'El complemento en reversa de TTACG es CGTAA.');
q(5,'Los transposones son…','Segmentos móviles de ADN (genes saltarines) que pueden cambiar de posición y alterar la organización cromosómica',['Genes que nunca cambian de lugar','Tipos de intrones','Proteínas del ribosoma'],'Poca selectividad de inserción; pueden interrumpir genes y afectar la expresión. Son la fuente más común de mutaciones.');
q(5,'Un transposón de ADN está flanqueado en sus extremos internos por…','Repeticiones invertidas',['Repeticiones directas siempre','Secuencias poli-A','Intrones'],'Las repeticiones directas están fuera del transposón y quedan como evidencia de que hubo uno.');
q(5,'Las repeticiones directas que quedan fuera de un transposón…','No se transponen; quedan como antecedente de que ahí hubo un transposón',['Se transponen con él','Son intrones','Se traducen'],'Todos los elementos transponibles contienen repeticiones directas en los extremos externos.');
q(5,'Los retrotransposones se diferencian de los transposones de ADN en que…','Se transponen a través de un intermediario de RNA',['Se transponen solo mediante proteínas','No usan enzimas','Se copian por conjugación'],'Los SINEs y LINEs son retrotransposones (repeticiones intercaladas).');
q(5,'LINEs (Long Interspersed Nucleotide Sequences) miden aproximadamente…','6–7 kb',['100–300 pb','10–60 nt','1 pb'],'Los SINEs son cortos: 100–300 pb.');
q(5,'SINEs miden aproximadamente…','100 a 300 pb',['6–7 kb','10–60 nt','1,000 kb'],'Son secuencias intercaladas cortas altamente repetitivas.');
q(5,'Las LTR (Long Terminal Repeats) son…','Repeticiones directas que bordean transposones autónomos y no autónomos',['Repeticiones en tándem de 3 nt','Pseudogenes','Intrones largos'],'Son repeticiones terminales.');
q(5,'Los microsatélites (STR) se usan en…','Genética forense, por su variabilidad',['Producción de insulina','Edición del RNA','Secuenciación Sanger'],'Los STR son repeticiones en tándem cortas (Short Tandem Repeats).');
q(5,'Los minisatélites son repeticiones en tándem de…','10 a 60 nucleótidos',['2 nucleótidos','1–6 kb','>300 pb'],'Los VNTR (Variable Number Tandem Repeats) cambian de número entre generaciones.');
q(5,'Las enfermedades por expansión de trinucleótidos incluyen…','Huntington (CAG), síndrome de X frágil (CGG) y distrofia muscular',['Fibrosis quística y hemofilia','Diabetes y gota','Anemia y malaria'],'Las repeticiones aumentan a través de generaciones.');
q(5,'En la enfermedad de Huntington la repetición expandida es…','CAG (codifica glutamina), formando un tramo de poliglutamina en la huntingtina',['CGG','GCN','TTAGGG'],'CAG = glutamina, CGG = arginina, GCN = alanina.');
q(5,'Según la presentación, ¿cuál es el rango normal vs. enfermo de repeticiones CAG en Huntington?','Normal: 11–34; enfermo: 36–121',['Normal: 100–200; enfermo: 1–10','Normal: 0; enfermo: 1','Normal: 36–121; enfermo: 11–34'],'Más repeticiones = enfermedad; aumentan entre generaciones.');
q(5,'Los pseudogenes son…','Secuencias no funcionales similares a genes; copias defectuosas de un gen funcional',['Genes funcionales con muchos intrones','Genes mitocondriales','Elementos de transposición activos'],'Defecto común: codón stop. Antes se consideraban ADN basura.');
q(5,'Un pseudogén procesado…','Surge por retrotranscripción (copiado de cDNA): carece de intrones, promotor y elementos regulatorios; solo tiene exones',['Conserva intrones y promotor','Es una copia de ADN genómico','Es un gen funcional'],'Los procesados provienen del mRNA que se retrotranscribe y se integra al genoma.');
q(5,'Un pseudogén NO procesado…','Resulta de duplicar ADN genómico; suele estar cerca de su gen funcional (duplicación en tándem)',['Carece de intrones','No tiene origen en el ADN','Es un gen mitocondrial'],'Algunos están dispersos por recombinación.');
q(5,'Los pseudogenes solitarios…','No provienen del copiado de ADN; son ortólogos de genes funcionales de simios que se volvieron defectuosos en humanos',['Siempre están junto a su gen padre','Son procesados','No existen en humanos'],'Ortólogo: gen que evolucionó diferente en dos especies, pero viene del mismo ancestro.');
q(5,'¿Cuántos pseudogenes se han identificado en humanos, según la presentación?','>8,000 procesados y >4,000 no procesados',['Solo 50','>100,000 procesados','0'],'Aproximadamente el 10% de los genes codificantes tiene al menos un pseudogén procesado.');
q(5,'Un gen altamente expresado tiende a tener…','Múltiples pseudogenes procesados',['Ningún pseudogén','Solo pseudogenes solitarios','Solo duplicaciones segmentales'],'Ejemplo: proteína ribosomal citoplásmica: 95 genes funcionales, 79 proteínas y 2090 pseudogenes procesados.');
q(5,'PKD1 (enfermedad poliquística renal) es ejemplo de…','Un gen con 6 pseudogenes no procesados dispersos en 16p13.11, resultado de duplicación',['Un gen sin pseudogenes','Una repetición CAG','Un transposón'],'PKD1 mide ~46 kb y tiene más de 40 exones.');
q(5,'Funciones posibles de pseudogenes:','Regular a los genes parentales, producir siRNAs que regulan transposones, aportar diversidad (anticuerpos) y contribuir a enfermedad si se desregulan',['Ninguna, son ADN basura','Solo sintetizar proteínas completas','Replicar el genoma'],'Algunos se transcriben, otros producen proteínas truncas.');
q(5,'La duplicación génica en tándem surge por…','Entrecruzamiento entre cromátidas desalineadas',['Mutación puntual','Conjugación','Transducción'],'Genera un cromosoma con la secuencia duplicada y otro sin ella.');
q(5,'La transposición duplicativa ocurre cuando…','Un transposón se copia a otra posición dejando una copia en el sitio original',['Se duplica todo el genoma','Se pierde un cromosoma','Un gen salta y se destruye'],'Puede cambiar la diversidad genética y la evolución.');
q(5,'La duplicación de genoma completo justifica…','La existencia de 4 clusters de genes HOX en vertebrados',['La existencia de intrones','El código genético','La presencia de plásmidos'],'La genómica comparativa muestra que ocurrió durante la evolución.');
q(5,'La duplicación génica por fusión de células ancestrales se refiere a…','La endocitosis de una bacteria por una célula precursora eucariota; el genoma mitocondrial deriva del genoma bacteriano',['La fusión de dos virus','La mitosis','La conjugación en bacterias'],'Muchos genes bacterianos se transfirieron al núcleo; hay genes duplicados que codifican enzimas mitocondriales y citoplásmicas.');
q(5,'Las duplicaciones segmentales (LCRs) son…','Segmentos de >1 kb (10–300 kb) con múltiples genes; ~90% de similitud; pueden causar rearreglos y enfermedad',['Repeticiones de 3 nt','Pseudogenes procesados','Intrones largos'],'LCR = Low Copy Repeats. Provienen de translocaciones y pueden ser intra o intercromosomales.');
q(5,'Las duplicaciones segmentales son frecuentes en regiones…','Eucromáticas, que son inestables y propensas a recombinación',['Heterocromáticas del centrómero únicamente','Solo mitocondriales','Solo en bacterias'],'Aportan variación en el número de copias.');

/* ===== TEMA 6: 3.5–3.6 ADN recombinante y organismos modelo ===== */
q(6,'cDNA es…','ADN sintetizado a partir de RNA por la enzima retrotranscriptasa',['ADN circular de bacterias','Un tipo de plásmido','ADN de cadena doble de un virus'],'Es complementario al mRNA y no tiene intrones.');
q(6,'La PCR es…','Un método para amplificar segmentos de ADN con ciclos de desnaturalización, emparejamiento de cebadores y síntesis',['Un método de secuenciación','Una electroforesis','Un tipo de clonación en bacterias'],'Usa ADN polimerasa.');
q(6,'Un plásmido es…','ADN circular extracromosómico que se replica independientemente del cromosoma huésped',['Un virus','Un cromosoma lineal','Una enzima'],'Casi todas las bacterias tienen plásmidos; los de resistencia a antibióticos son plásmidos R.');
q(6,'Un vector de expresión es…','Un plásmido o fago con promotor diseñado para que el ADN insertado se exprese',['Una enzima de restricción','Una sonda marcada','Un transposón'],'Permite producir la proteína del gen insertado.');
q(6,'Una biblioteca de ADN es…','Una colección de moléculas clonadas de ADN (de todo o parte del genoma)',['Un conjunto de libros','Un tipo de gel','Un grupo de enzimas'],'Se forma con vectores idénticos que contienen diferente ADN insertado.');
q(6,'Un clon es…','Moléculas, células u organismos genéticamente idénticos derivados de un solo ancestro',['Un gen mutado','Un plásmido sin inserto','Un virus'],'En ADN: un segmento insertado en un plásmido o cromosoma que se replica para formar muchas copias.');
q(6,'Una nucleasa es…','Una enzima que rompe enlaces de ácidos nucleicos',['Una proteína estructural','Un vector','Un virus bacteriano'],'Las nucleasas de restricción son un ejemplo.');
q(6,'Un fago (bacteriófago) es…','Un virus que infecta bacterias',['Una bacteria','Un plásmido','Una enzima'],'La transducción es la transferencia de genes mediada por virus de una bacteria a otra.');
q(6,'¿Cuál es el orden de pasos de la tecnología de ADN recombinante?','Aislar el gen → clonar → introducir el vector en células huésped → seleccionar células transformadas → expresar el gen → purificar',['Purificar → clonar → expresar → seleccionar','Seleccionar → aislar → purificar','Expresar → clonar → aislar'],'Es el flujo general para producir proteínas como insulina.');
q(6,'La selección de células transformadas se logra con…','Marcadores genéticos de resistencia a antibióticos incluidos en el vector',['Electroforesis','Fluorescencia de bromuro de etidio','Enzimas de restricción únicamente'],'Solo algunas células incorporan el ADN recombinante.');
q(6,'La introducción de un vector en células puede hacerse por…','Transformación, transfección o infección, según el tipo celular y el vector',['Solo conjugación','Solo electroforesis','Replicación'],'Depende de si la célula es bacteria, levadura, planta o animal.');
q(6,'Las nucleasas de restricción se obtienen de…','Bacterias, donde sirven como mecanismo de destrucción de ADN foráneo',['Virus','Plantas','Mitocondrias'],'Diferentes bacterias tienen diferentes nucleasas de restricción.');
q(6,'HaeIII reconoce secuencias de 4 nt. ¿Cada cuánto cortaría en promedio?','Aproximadamente cada 256 nt',['Cada 4 nt','Cada 65,536 nt','Cada 1,000 nt'],'4⁴ = 256. Para una de 8 nt: 4⁸ = 65,536.');
q(6,'Una enzima que reconoce 8 nt cortaría en promedio cada…','65,536 nt',['256 nt','1,024 nt','8 nt'],'4⁸ = 65,536.');
q(6,'Los extremos “pegajosos” (sticky ends)…','Facilitan unir el ADN con otra secuencia por complementariedad',['Impiden que el ADN se una','Se degradan siempre','Son del RNA'],'Se generan cuando la enzima hace un corte sesgado.');
q(6,'Las secuencias que reconocen las enzimas de restricción son…','Simétricas (palindrómicas)',['Aleatorias','Únicamente de RNA','De una sola base'],'El corte puede ser recto (romo) o sesgado (extremos cohesivos).');
q(6,'¿Por qué para clonar genes eucariotas en bacterias se usa cDNA?','Porque las bacterias carecen de spliceosoma y no pueden eliminar los intrones',['Porque el cDNA es más grande','Porque las bacterias tienen núcleo','Porque el ADN genómico no se puede cortar'],'El cDNA proviene del mRNA maduro, ya sin intrones.');
q(6,'¿Cómo se obtiene cDNA a partir de mRNA?','Con retrotranscriptasa usando un oligo-T como primer, que se aparea con el poli-A',['Con ADN ligasa','Con ADN polimerasa sin primer','Con Dicer'],'La enzima sintetiza el resto de la cadena con los dNTPs disponibles.');
q(6,'En la producción de insulina recombinante en E. coli, la bacteria trabaja con…','El cDNA de la proinsulina',['El gen completo con intrones','El mRNA directamente','Proteína'],'La insulina se produce primero como proinsulina.');
q(6,'La hibridación de colonias se usa para…','Identificar, entre colonias de una biblioteca, la que contiene el gen de interés usando una sonda complementaria',['Medir el peso de las colonias','Secuenciar toda la biblioteca','Cortar el ADN'],'Se hace una impresión de las colonias en un filtro de membrana; las células se rompen y el filtro se incuba con la sonda, similar a Southern y Northern.');
q(6,'Ventajas de trabajar con procariotas:','Menor tamaño, rápida reproducción, mayor cantidad por área de cultivo y haploidía (todo cambio se expresa de inmediato)',['Son diploides','Tienen spliceosoma','Tienen núcleo'],'Por eso se usan bacterias como E. coli.');
q(6,'E. coli tiene un cromosoma…','Circular de ~4.7 millones de pb; sintetiza ~1,700 enzimas, agrupadas en ~75 operones',['Lineal de 3,000 millones de pb','Circular de 5,386 pb','Con 46 cromosomas'],'Es una bacteria intestinal de ~1 µm de longitud.');
q(6,'La CONJUGACIÓN bacteriana es…','La transferencia directa de ADN (plásmido) de una célula donadora a una receptora',['La absorción de ADN libre del medio','La transferencia mediada por fagos','La división celular'],'Transformación: ADN libre del medio. Transducción: mediada por bacteriófagos.');
q(6,'La TRANSFORMACIÓN bacteriana es…','La absorción de ADN libre en el medio (de células muertas) por otras bacterias',['La transferencia con virus','La transferencia con plásmido directo','La mitosis'],'Es uno de los tres mecanismos de recombinación génica en bacterias.');
q(6,'La TRANSDUCCIÓN bacteriana es…','La transferencia de ADN bacteriano de una célula a otra mediante bacteriófagos',['La transferencia por contacto directo','La absorción de ADN libre','La replicación'],'Los fagos llevan en la cápside fragmentos de ADN de la bacteria huésped.');
q(6,'Un operón inducible…','Se activa cuando algo está presente',['Se inhibe cuando algo está presente','No se regula','Siempre está apagado'],'Reprimible: se inhibe cuando algo está presente. Los operones son clusters de genes corregulados.');
q(6,'¿Cuál es la diferencia entre ciclo lítico y lisogénico?','En el lítico el virus se replica y lisa la célula; en el lisogénico el genoma viral se integra al del huésped',['No hay diferencia','En el lisogénico la célula muere siempre','El lítico solo ocurre en virus de RNA'],'Son las dos opciones de ciclo reproductivo al inyectar su información en la célula huésped.');
q(6,'GloFish son…','Peces cebra transgénicos con un gen de proteína fluorescente (gfp), en distintos colores',['Peces con mutaciones al azar','Peces clonados','Peces con RNAi'],'Son un ejemplo de organismo transgénico (Danio rerio).');
q(6,'El arroz dorado (Golden rice) es transgénico para producir…','Carotenos (precursores de vitamina A)',['Insulina','Proteína fluorescente','Resistencia a insectos'],'Es una aplicación de ADN recombinante en plantas.');
q(6,'El maíz Bt expresa…','La proteína insecticida Cry1Ab de Bacillus thuringiensis, resistente al barrenador europeo del maíz',['Una hormona de crecimiento','Carotenos','Proteína fluorescente'],'Es resistencia a plagas.');
q(6,'El salmón coho modificado tiene…','Un gen de hormona del crecimiento tipo 1 que acelera su maduración y crecimiento',['Un gen de proteína fluorescente','Un gen de insulina','Genes de carotenos'],'Se inyectó en huevos fecundados.');
q(6,'Alcanivorax borkumensis es una bacteria que…','Consume aceites, útil en derrames petroleros',['Produce insulina','Es resistente a insectos','Produce proteína fluorescente'],'Los productos de su degradación son CO₂ y ácidos grasos.');
q(6,'¿Qué hace un ratón knock-out?','Se elimina o inactiva un gen específico para estudiar su función',['Se le inserta un gen fluorescente siempre','Se le duplica el genoma','Se le añade un plásmido'],'Existen métodos para probar la funcionalidad de cualquier gen del ratón (ratones mutantes a la medida).');
q(6,'Organismo modelo de levadura:','Saccharomyces cerevisiae',['Arabidopsis thaliana','Danio rerio','Xenopus laevis'],'Es unicelular, robusta y se estudió para determinar el ciclo de división celular eucariota.');
q(6,'Organismo modelo de planta:','Arabidopsis thaliana',['Saccharomyces cerevisiae','Mus musculus','C. elegans'],'Crece en interiores y produce miles de plantas hijas.');
q(6,'Caenorhabditis elegans se desarrolla con precisión hasta un adulto con…','959 células corporales',['46 células','1,000,000 de células','10 células'],'Permitió entender división y muerte celular; útil en biología del desarrollo y cáncer.');
q(6,'Drosophila melanogaster:','Permitió probar que los genes están en los cromosomas; tarda ~9 días de óvulo a adulto',['Es transparente las primeras 2 semanas','Tiene genoma la mitad del humano','Tiene 959 células'],'Se identificaron genes de partes corporales mal ubicadas.');
q(6,'Xenopus laevis es útil porque…','Sus huevos fecundados son grandes, fáciles de manipular y se fertilizan fuera del organismo',['Es transparente','Es ideal para análisis genéticos','Tiene un genoma pequeño'],'No sirve para análisis genéticos por revoltura de ADN.');
q(6,'Danio rerio (pez cebra):','Tiene un genoma ~mitad del humano, generación ~3 meses y es transparente las primeras 2 semanas',['Tarda 9 días','Tiene 959 células','Es de reproducción lenta'],'Permite observar comportamiento celular en el organismo vivo.');
q(6,'Mus musculus es modelo porque…','Es un mamífero pequeño, de rápida procreación, con ~el doble de genes que Drosophila y se pueden crear mutantes a la medida',['No tiene genes en común con humanos','Solo tiene 959 células','Es unicelular'],'Los mamíferos son un grupo altamente uniforme.');
v(6,'Los genes de eucariotas pueden introducirse, simplificados, en bacterias para que produzcan la proteína.',true,'Es la base de producir proteínas humanas como insulina o factores de coagulación en bacterias.');

/* ===== TEMA 7: 3.13c Biomarcadores ===== */
q(7,'Un biomarcador es…','Cualquier sustancia, estructura o proceso medible que puede influir o predecir la incidencia de un resultado o enfermedad (OMS)',['Solo una proteína','Un tipo de gen','Un tratamiento'],'En proteómica: sustancia presente en el organismo durante un proceso biológico que indica una condición.');
q(7,'Además de la presencia de enfermedad, un biomarcador puede informar…','Etapa de la enfermedad y efectos de tratamientos, intervenciones y exposiciones ambientales',['Solo el color de la piel','Solo la edad','Nada más'],'Sirve también para medir exposición a químicos o nutrientes.');
q(7,'La detección CUANTITATIVA de un biomarcador indica…','La cantidad de biomarcador / enfermedad',['Solo presencia','La secuencia','El nombre'],'La cualitativa indica presencia. Para anticuerpos se usan ELISA e inmunohistoquímica (IHC).');
q(7,'La relevancia de un biomarcador se refiere a…','Su capacidad de proveer información clínicamente relevante',['Su costo','Su color','Su tamaño'],'La validez caracteriza la efectividad del biomarcador o su utilidad como punto final de análisis.');
q(7,'SENSIBILIDAD es…','La capacidad de la prueba de detectar la enfermedad: verdaderos positivos / (verdaderos positivos + falsos negativos)',['Verdaderos negativos / todos los sanos','Falsos positivos / todos','La cantidad de dinero que cuesta'],'Sensibilidad = A / (A + C).');
q(7,'ESPECIFICIDAD es…','La capacidad de dar negativo en quien no tiene la enfermedad: verdaderos negativos / (falsos positivos + verdaderos negativos)',['Verdaderos positivos / enfermos','Falsos negativos / todos','Es lo mismo que sensibilidad'],'Especificidad = D / (B + D).');
q(7,'Una prueba da: Prueba+ y enfermedad+ = 90; Prueba+ y enfermedad− = 150; Prueba− y enfermedad+ = 10; Prueba− y enfermedad− = 750. ¿Cuál es su sensibilidad?','90%',['83%','60%','75%'],'90 / (90 + 10) = 90%.');
q(7,'Con esos mismos datos (90, 150, 10, 750) ¿cuál es la especificidad?','83%',['90%','60%','95%'],'750 / (150 + 750) = 83%.');
q(7,'Prueba: VP = 80, FP = 30, FN = 20, VN = 170. ¿Sensibilidad y especificidad?','Sensibilidad 80%, especificidad 85%',['Sensibilidad 85%, especificidad 80%','Ambas 80%','Sensibilidad 73%, especificidad 89%'],'S = 80/(80+20) = 80%; E = 170/(170+30) = 85%.');
q(7,'Prueba: VP = 45, FP = 5, FN = 55, VN = 95. ¿Sensibilidad y especificidad?','Sensibilidad 45%, especificidad 95%',['Sensibilidad 95%, especificidad 45%','Ambas 50%','Sensibilidad 90%, especificidad 90%'],'S = 45/(45+55) = 45%; E = 95/(95+5) = 95%.');
q(7,'Para una enfermedad grave que se debe detectar sí o sí (tamizaje), lo más importante es…','Alta sensibilidad, para no dejar escapar casos',['Alta especificidad únicamente','Bajo costo únicamente','Que sea cualitativa'],'En el ejemplo de la clase se concluyó que la sensibilidad era más importante que la especificidad.');
q(7,'Un biomarcador para proyección/pronóstico debe ser…','Específico (minimizar falsos positivos y negativos), reflejar temprano las etapas, detectable sin procedimientos complejos y costeable',['Costoso','Detectable solo con cirugía','Tardío'],'Esas son las características deseables.');
q(7,'¿Cuáles son muestras viables para detectar biomarcadores?','Fluidos corporales (sangre, orina, saliva, semen) y tejido',['Solo tejido de biopsia','Solo orina','Solo ADN mitocondrial'],'Ejemplos de fluidos: sangre, orina, saliva y semen.');
q(7,'El PSA es…','Una proteína producida por la próstata (antígeno prostático específico), biomarcador de cáncer de próstata',['Una enzima de restricción','Un tipo de secuenciación','Una hormona del páncreas'],'También se conoce como seminina, γ-seminoproteína o antígeno P-30; mantiene la consistencia líquida del semen.');
q(7,'¿Cuál es una limitación del PSA como biomarcador?','También se encuentra en células prostáticas benignas',['No se detecta nunca','Solo aparece en mujeres','Solo se detecta en tejido'],'Por eso se combina con otros estudios (en combinación duplica la detección temprana).');
q(7,'El cáncer de próstata suele ser…','Asintomático hasta etapa avanzada o metastásica',['Sintomático desde etapa 1','Siempre doloroso','Siempre detectable sin pruebas'],'De ahí la importancia de un biomarcador como PSA.');
q(7,'GFAP (Glial Fibrillary Acidic Protein) es biomarcador de…','Daño cerebral (traumatismo con lesión cerebral), liberada al sistema nervioso tras una lesión',['Cáncer de próstata','Diabetes','Infección por VIH'],'La TBI causa más de 50,000 muertes anuales; se detecta con tomografía, resonancia y evaluación inicial.');
q(7,'El ensayo Bio-Plex Pro Human Cancer Biomarker mide…','34 biomarcadores en procesos como angiogénesis, metástasis, proliferación, apoptosis, adhesión/migración e inflamación',['Un solo biomarcador','Solo PSA','Solo ADN'],'Se basa en perlas magnéticas, para investigación clínica o preclínica.');
v(7,'La sensibilidad y la especificidad miden lo mismo.',false,'La sensibilidad mide la detección de enfermos (verdaderos positivos); la especificidad mide la detección de sanos (verdaderos negativos).');

var $=function(i){return document.getElementById(i)};
var sel=new Set(TOPICS.map(function(_,i){return i}));
var pool=[],cur=0,ans=[],locked=false;
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function cnt(t){return Q.filter(function(x){return x.t===t}).length}
function total(){return Q.filter(function(x){return sel.has(x.t)}).length}
$('sub').textContent=Q.length+' preguntas · retroalimentación inmediata · filtra por tema';
function home(){
 $('quiz').classList.add('hide');$('res').classList.add('hide');$('home').classList.remove('hide');
 var h='<h2>Elige los temas</h2><div class="chips">';
 TOPICS.forEach(function(n,i){h+='<label class="chip'+(sel.has(i)?' on':'')+'"><input type="checkbox" data-t="'+i+'"'+(sel.has(i)?' checked':'')+'> '+n+' <small>('+cnt(i)+')</small></label>'});
 h+='</div><div class="row"><button class="sec" id="all">Todos</button><button class="sec" id="none">Ninguno</button></div>';
 h+='<div class="row"><label>Número de preguntas: <select id="n"><option value="0">Todas</option><option value="20">20</option><option value="40">40</option><option value="60">60</option><option value="100">100</option></select></label><label><input type="checkbox" id="mix" checked> Mezclar orden</label></div>';
 h+='<div class="row"><button id="go">Comenzar</button><span id="info" style="color:var(--mu)"></span></div>';
 $('home').innerHTML=h;
 var upd=function(){var n=total();$('info').textContent=n+' preguntas disponibles';$('go').disabled=n===0};
 document.querySelectorAll('[data-t]').forEach(function(c){c.onchange=function(){var t=+c.dataset.t;c.checked?sel.add(t):sel.delete(t);c.parentNode.classList.toggle('on',c.checked);upd()}});
 $('all').onclick=function(){sel=new Set(TOPICS.map(function(_,i){return i}));home()};
 $('none').onclick=function(){sel=new Set();home()};
 $('go').onclick=function(){var n=+$('n').value;var p=Q.filter(function(x){return sel.has(x.t)});if($('mix').checked)p=shuf(p);if(n&&n<p.length)p=p.slice(0,n);start(p)};
 upd();
}
function prep(x){var o=x.o.map(function(t,i){return{t:t,k:i===x.c}});if(!x.fx)o=shuf(o);return{t:x.t,s:x.s,e:x.e,o:o}}
function start(p){pool=p.map(prep);cur=0;ans=[];$('home').classList.add('hide');$('res').classList.add('hide');$('quiz').classList.remove('hide');show()}
function show(){
 var x=pool[cur];locked=false;
 var ok=ans.filter(function(a){return a&&a.ok}).length,done=ans.filter(function(a){return a}).length;
 var h='<div class="card"><div class="top"><span>Pregunta '+(cur+1)+' de '+pool.length+'</span><span>✔ '+ok+' · ✘ '+(done-ok)+(done?' · '+Math.round(ok/done*100)+'%':'')+'</span></div>';
 h+='<div class="bar"><i style="width:'+(done/pool.length*100)+'%"></i></div>';
 h+='<span class="tag">'+TOPICS[x.t]+'</span><p class="q">'+x.s+'</p><div id="opts">';
 x.o.forEach(function(o,i){h+='<button class="opt" data-i="'+i+'">'+o.t+'</button>'});
 h+='</div><div id="fb"></div><div class="row"><button id="nx" class="hide"></button><button class="sec" id="ex">Salir al inicio</button></div></div>';
 $('quiz').innerHTML=h;
 document.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){pick(+b.dataset.i)}});
 $('ex').onclick=function(){if(confirm('¿Salir? Se perderá el progreso de este intento.'))home()};
}
function pick(i){
 if(locked)return;locked=true;var x=pool[cur],good=x.o[i].k;
 ans[cur]={ok:good,i:i};
 document.querySelectorAll('.opt').forEach(function(b,j){b.disabled=true;if(x.o[j].k)b.classList.add('ok');else if(j===i)b.classList.add('no')});
 var cor=x.o.filter(function(o){return o.k})[0].t;
 $('fb').innerHTML='<div class="fb '+(good?'ok':'no')+'"><b>'+(good?'✅ ¡Correcto!':'❌ Incorrecto')+'</b>'+(good?'':'Respuesta correcta: <b style="display:inline">'+cor+'</b><br>')+x.e+'</div>';
 var nx=$('nx');nx.classList.remove('hide');nx.textContent=cur<pool.length-1?'Siguiente →':'Ver resultados';
 nx.onclick=function(){if(cur<pool.length-1){cur++;show()}else results()};
 var ok=ans.filter(function(a){return a&&a.ok}).length,done=ans.filter(function(a){return a}).length;
 document.querySelector('.bar i').style.width=(done/pool.length*100)+'%';
 document.querySelector('.top span:last-child').textContent='✔ '+ok+' · ✘ '+(done-ok)+' · '+Math.round(ok/done*100)+'%';
}
function results(){
 $('quiz').classList.add('hide');$('res').classList.remove('hide');
 var ok=ans.filter(function(a){return a&&a.ok}).length,n=pool.length,pc=Math.round(ok/n*100);
 var h='<div class="card"><p class="big">'+pc+'%</p><p>'+ok+' de '+n+' correctas · '+(pc>=90?'¡Excelente, vas listo!':pc>=70?'Muy bien, repasa lo que falló.':'Repasa los temas en rojo y vuelve a intentar.')+'</p></div>';
 h+='<div class="card"><h2>Resultados por tema</h2>';
 var by={};pool.forEach(function(x,i){var b=by[x.t]||(by[x.t]={a:0,n:0});b.n++;if(ans[i]&&ans[i].ok)b.a++});
 Object.keys(by).forEach(function(t){var b=by[t],p=Math.round(b.a/b.n*100);var c=p>=80?'var(--ok)':p>=60?'#e0a100':'var(--no)';
  h+='<div class="tr"><div>'+TOPICS[t]+'<div class="b"><i style="width:'+p+'%;background:'+c+'"></i></div></div><div><b>'+p+'%</b><br><small>'+b.a+'/'+b.n+'</small></div></div>'});
 h+='</div>';
 var bad=[];pool.forEach(function(x,i){if(!ans[i]||!ans[i].ok)bad.push(i)});
 h+='<div class="card"><h2>Preguntas falladas ('+bad.length+')</h2>';
 if(!bad.length)h+='<p>¡Ninguna! 🎉</p>';
 bad.forEach(function(i){var x=pool[i];var c=x.o.filter(function(o){return o.k})[0].t;h+='<div class="rev"><span class="tag">'+TOPICS[x.t]+'</span><p><b>'+x.s+'</b></p><p>✅ '+c+'</p><p style="color:var(--mu)">'+x.e+'</p></div>'});
 h+='<div class="row">'+(bad.length?'<button id="rf">Repasar solo las falladas</button>':'')+'<button class="sec" id="rt">Repetir mismo examen</button><button class="sec" id="hm">Volver al inicio</button></div></div>';
 $('res').innerHTML=h;
 if(bad.length)$('rf').onclick=function(){var s=bad.map(function(i){return pool[i]});pool=shuf(s).map(function(x){return{t:x.t,s:x.s,e:x.e,o:shuf(x.o)}});cur=0;ans=[];$('res').classList.add('hide');$('quiz').classList.remove('hide');show()};
 $('rt').onclick=function(){pool=shuf(pool).map(function(x){return{t:x.t,s:x.s,e:x.e,o:shuf(x.o)}});cur=0;ans=[];$('res').classList.add('hide');$('quiz').classList.remove('hide');show()};
 $('hm').onclick=home;window.scrollTo(0,0);
}
home();
</script>
</body>
</html>
